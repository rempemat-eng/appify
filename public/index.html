<!doctype html>
<!--
  Web HTML template (used by `expo export -p web` and the dev server because
  web.output is 'single' — app/+html.tsx only applies to 'static' output).
  The lang attribute and title below are substituted from app.config.ts at
  build time; only their FIRST occurrence in this file is replaced, so don't
  repeat those placeholder tokens anywhere above them.

  Carries the PWA install contract: the manifest link for Android/Chrome and the
  apple-* tags iOS Safari needs (iOS ignores most of the manifest). Keep the app
  identity in public/manifest.json in sync with the name in app.config.ts.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="NapAttack — nap to grow. wake to raid." />
    <meta property="og:title" content="NapAttack" />
    <meta property="og:description" content="nap to grow. wake to raid." />
    <meta property="og:image" content="/icons/napattack.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NapAttack" />
    <meta name="twitter:description" content="nap to grow. wake to raid." />
    <meta name="application-name" content="NapAttack" />

    <!-- Web app manifest — the install contract for Android/Chrome -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FBF4E4" />

    <!-- iOS home-screen support. No apple-mobile-web-app-title: iOS falls back to
         <title>, which is substituted from app.config.ts and stays in sync. -->
    <link rel="apple-touch-icon" sizes="1024x1024" href="/icons/napattack.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Pixel frames (components/pixel-frame.tsx) are absolutely positioned
         first children. On the web an absolute box paints above unpositioned
         siblings, so icons and text fields would hide behind the frame. Making
         them positioned keeps DOM order, as on native. Any explicit position
         from a component's own style still wins over this type selector. */
      svg,
      input,
      textarea {
        position: relative;
      }
      /* Every SVG in the game is pixel art on a grid (icons, card art, props):
         snap its pixels to the screen instead of blurring their edges. */
      svg {
        shape-rendering: crispEdges;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
