name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # drafts wait until they are marked ready (ready_for_review starts the run)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install 'Pillow==12.3.0' 'numpy==2.5.3'
      - name: Restore matching world-audit previews
        id: world-audit-previews
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/world-audit-previews
          key: ${{ runner.os }}-world-audit-previews-v1-${{ hashFiles('scripts/art/**/*.py', 'scripts/art/*.json', 'assets/**/*.png', 'art/world-audit-regions.json', 'art/house-palette.json', 'lib/zone-*.ts', 'lib/garden-*.ts', 'lib/resident-routes.ts', 'lib/world-canvas*.ts', 'package-lock.json') }}
      - name: Verify source and web export
        env:
          WORLD_AUDIT_OUT: .cache/world-audit-previews
          # A hit skips only image rendering. The audit, fixtures and gate still execute.
          WORLD_AUDIT_NO_IMAGES: ${{ steps.world-audit-previews.outputs.cache-hit == 'true' && '1' || '0' }}
        run: npm run verify
      - name: Report current asset-ledger inventory
        if: always()
        continue-on-error: true
        run: npm run check:assets -- --summary
      - name: Report imported PNG decoded memory
        if: always()
        run: npm run check:images
