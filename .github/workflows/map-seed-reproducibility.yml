name: Prospective map seed reproducibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/vision/research/blockout/geo5.py'
      - 'docs/vision/research/blockout/towns55.py'
      - 'scripts/review/test_map_seed_reproducibility.py'
      - 'docs/codex/map-reproduction-contract.md'
      - '.github/workflows/map-seed-reproducibility.yml'
  push:
    branches: [main]
    paths:
      - 'docs/vision/research/blockout/geo5.py'
      - 'docs/vision/research/blockout/towns55.py'
      - 'scripts/review/test_map_seed_reproducibility.py'
      - 'docs/codex/map-reproduction-contract.md'
      - '.github/workflows/map-seed-reproducibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seeds:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the existing blockout test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
          python -m pip install 'numpy==2.5.3' 'scipy==1.18.1' 'Pillow==12.3.0' 'scikit-image==0.26.0'
      - name: Exercise real seed consumers in small normal and isolated subprocesses
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          echo 'Prospective seed/fixture coverage only; no raw-world generation or historical terrain/art acceptance.'
          python -m pip show numpy scipy Pillow scikit-image
          python -m unittest scripts.review.test_map_seed_reproducibility -v
