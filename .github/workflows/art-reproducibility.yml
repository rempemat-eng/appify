name: Art reproducibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'art/**'
      - 'public/**'
      # the generated files it compares, and the lib files the generators read
      - 'lib/zone-*.ts'
      - 'lib/world-canvas*.ts'
      - 'lib/garden-*.ts'
      - 'lib/decor*.ts'
      - 'lib/world-maps.ts'
      - 'lib/journey*.ts'
      - 'lib/*-assets.ts'
      - 'lib/*-sprites.ts'
      - 'lib/icon-art.ts'
      - 'lib/mission-map.ts'
      - 'lib/resident-routes.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.oxfmtrc.json'
      - '.github/workflows/art-reproducibility.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'art/**'
      - 'public/**'
      # the generated files it compares, and the lib files the generators read
      - 'lib/zone-*.ts'
      - 'lib/world-canvas*.ts'
      - 'lib/garden-*.ts'
      - 'lib/decor*.ts'
      - 'lib/world-maps.ts'
      - 'lib/journey*.ts'
      - 'lib/*-assets.ts'
      - 'lib/*-sprites.ts'
      - 'lib/icon-art.ts'
      - 'lib/mission-map.ts'
      - 'lib/resident-routes.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.oxfmtrc.json'
      - '.github/workflows/art-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-reproducibility:
    # drafts wait until they are marked ready (ready_for_review starts the run)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install 'Pillow==12.3.0' 'numpy==2.5.3'
      - name: Test the reproducibility guard
        run: npm run check:art-repro-test
      - name: Regenerate, compare bytes and check sprite outlines
        run: npm run check:art-repro
