name: MyGame desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
      TEMPLATE_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install verified Godot and desktop templates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          godot=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          version=$("$godot" --version)
          [[ "$version" == "$GODOT_VERSION.stable.official."* ]]
          template="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          archive="$RUNNER_TEMP/$template"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$template"
          printf '%s  %s\n' "$TEMPLATE_SHA256" "$archive" | sha256sum --check --strict

          # get_godot.sh installs the engine in self-contained mode.
          templates="$(dirname "$godot")/editor_data/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$templates"
          unzip -j "$archive" 'templates/linux_release.x86_64' \
            'templates/windows_release_x86_64.exe' -d "$templates"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"

      - name: Export and package Windows and Linux
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/mygame-stage"
          output="$RUNNER_TEMP/mygame-desktop"
          mkdir -p "$stage/linux-x86_64" "$stage/windows-x86_64" "$output"
          bash game/tools/fetch_limboai_release.sh
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game --export-release 'Linux x86_64' "$stage/linux-x86_64/MyGame"
          "$GODOT" --headless --path game --export-release 'Windows x86_64' "$stage/windows-x86_64/MyGame.exe"

          test -s "$stage/linux-x86_64/MyGame"
          test -x "$stage/linux-x86_64/MyGame"
          test -s "$stage/windows-x86_64/MyGame.exe"
          for platform in linux-x86_64 windows-x86_64; do
            test -s "$stage/$platform/MyGame.pck"
            printf 'commit=%s\ngodot=%s\nplatform=%s\ntemplate_sha256=%s\n' \
              "$GITHUB_SHA" "$("$GODOT" --version)" "$platform" "$TEMPLATE_SHA256" \
              > "$stage/$platform/BUILD-INFO.txt"
          done

          tar -czf "$output/MyGame-linux-x86_64.tar.gz" -C "$stage" linux-x86_64
          (cd "$stage" && zip -q -r "$output/MyGame-windows-x86_64.zip" windows-x86_64)
          (cd "$output" && sha256sum MyGame-linux-x86_64.tar.gz MyGame-windows-x86_64.zip > SHA256SUMS)

      - name: Upload desktop builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyGame-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/mygame-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Temporary diagnostic for #464. Remove before marking the PR ready.
  diagnose-linux:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 464 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/m0-desktop-build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: '20e616d8056143c33ddbeff44e200d946ac9f445'
      SOURCE_TREE: '0d8d709bf342127558c0fbb0db44ebd3850ff4d4'
      GODOT_VERSION: '4.7.2'
      TEMPLATE_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the failed export source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install Xvfb and record runner
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mygame-diagnostic-logs"
          mkdir -p "$logs"
          {
            cat /etc/os-release
            uname -m
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0
            command -v Xvfb
            command -v xvfb-run
          } 2>&1 | tee "$logs/setup.log"

      - name: Install verified Godot and Linux template
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          godot=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          version=$("$godot" --version)
          [[ "$version" == "$GODOT_VERSION.stable.official."* ]]
          template="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          archive="$RUNNER_TEMP/$template"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$template"
          printf '%s  %s\n' "$TEMPLATE_SHA256" "$archive" | sha256sum --check --strict

          # get_godot.sh installs the engine in self-contained mode.
          templates="$(dirname "$godot")/editor_data/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$templates"
          unzip -j "$archive" 'templates/linux_release.x86_64' -d "$templates"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"

      - name: Compare export with only the GdUnit editor plugin disabled
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mygame-diagnostic-logs"
          stage="$RUNNER_TEMP/mygame-diagnostic-stage"
          mkdir -p "$stage"
          bash game/tools/fetch_limboai_release.sh >"$logs/limboai.log" 2>&1
          "$GODOT" --headless --path game --import >"$logs/import.log" 2>&1

          backup="$stage/project.godot.before"
          cp game/project.godot "$backup"
          restore_source() {
            result=$?
            trap - EXIT
            cp "$backup" game/project.godot
            {
              cmp "$backup" game/project.godot &&
              git diff --exit-code HEAD &&
              test -z "$(git status --porcelain)" &&
              sha256sum game/project.godot &&
              echo "Original source restored"
            } >"$logs/source-restored.log" 2>&1 || result=1
            exit "$result"
          }
          trap restore_source EXIT

          python3 - >"$logs/project-delta.log" <<'PY'
          from pathlib import Path
          import difflib
          import hashlib

          path = Path("game/project.godot")
          original = path.read_bytes()
          text = original.decode()
          start = text.index("[editor_plugins]\n")
          end = text.index("\n[", start + 1)
          section = text[start:end]
          target = ', "res://addons/gdUnit4/plugin.cfg"'
          assert section.count(target) == 1
          revised_section = section.replace(target, "")
          revised = (text[:start] + revised_section + text[end:]).encode()
          assert revised.count(b"res://addons/gdUnit4/plugin.cfg") == 0
          for preserved in (b"res://addons/phantom_camera/plugin.cfg", b"res://addons/world_editor/plugin.cfg"):
              assert original.count(preserved) == revised.count(preserved) == 1
          print("before_sha256=" + hashlib.sha256(original).hexdigest())
          print("diagnostic_sha256=" + hashlib.sha256(revised).hexdigest())
          print("".join(difflib.unified_diff(text.splitlines(True), revised.decode().splitlines(True),
                                          fromfile="original/project.godot", tofile="diagnostic/project.godot")))
          path.write_bytes(revised)
          PY

          status=0
          LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=10s 10m xvfb-run -a \
            "$GODOT" --display-driver x11 --rendering-method gl_compatibility \
            --audio-driver Dummy --path game --export-release 'Linux x86_64' "$stage/MyGame" \
            >"$logs/linux-xvfb.log" 2>&1 || status=$?
          printf 'export_status=%s\n' "$status" | tee "$logs/exit.txt"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          python3 - "$stage" >"$logs/output-checks.log" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import sys

          stage = Path(sys.argv[1])
          executable = stage / "MyGame"
          pack = stage / "MyGame.pck"
          library = stage / "liblimboai.linux.template_release.x86_64.so"
          source_library = Path("game/addons/limboai/bin") / library.name
          with executable.open("rb") as stream:
              assert stream.read(4) == b"\x7fELF"
          assert os.access(executable, os.X_OK)
          with pack.open("rb") as stream:
              assert stream.read(4) == b"GDPC"
          assert library.read_bytes() == source_library.read_bytes()
          for path in (executable, pack, library):
              assert path.stat().st_size > 0
              print(path.name, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())
          print("ELF, PCK and LimboAI copy checks passed")
          PY

      - name: Upload diagnostic logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyGame-linux-export-diagnostic
          path: ${{ runner.temp }}/mygame-diagnostic-logs/
          if-no-files-found: warn
          retention-days: 7
