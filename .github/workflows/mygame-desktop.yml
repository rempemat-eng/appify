name: MyGame desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
      TEMPLATE_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install verified Godot and desktop templates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          godot=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          version=$("$godot" --version)
          [[ "$version" == "$GODOT_VERSION.stable.official."* ]]
          template="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          archive="$RUNNER_TEMP/$template"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$template"
          printf '%s  %s\n' "$TEMPLATE_SHA256" "$archive" | sha256sum --check --strict

          # get_godot.sh installs the engine in self-contained mode.
          templates="$(dirname "$godot")/editor_data/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$templates"
          unzip -j "$archive" 'templates/linux_release.x86_64' \
            'templates/windows_release_x86_64.exe' -d "$templates"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"

      - name: Export and package Windows and Linux
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/mygame-stage"
          output="$RUNNER_TEMP/mygame-desktop"
          mkdir -p "$stage/linux-x86_64" "$stage/windows-x86_64" "$output"
          bash game/tools/fetch_limboai_release.sh
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game --export-release 'Linux x86_64' "$stage/linux-x86_64/MyGame"
          "$GODOT" --headless --path game --export-release 'Windows x86_64' "$stage/windows-x86_64/MyGame.exe"

          test -s "$stage/linux-x86_64/MyGame"
          test -x "$stage/linux-x86_64/MyGame"
          test -s "$stage/windows-x86_64/MyGame.exe"
          for platform in linux-x86_64 windows-x86_64; do
            test -s "$stage/$platform/MyGame.pck"
            printf 'commit=%s\ngodot=%s\nplatform=%s\ntemplate_sha256=%s\n' \
              "$GITHUB_SHA" "$("$GODOT" --version)" "$platform" "$TEMPLATE_SHA256" \
              > "$stage/$platform/BUILD-INFO.txt"
          done

          tar -czf "$output/MyGame-linux-x86_64.tar.gz" -C "$stage" linux-x86_64
          (cd "$stage" && zip -q -r "$output/MyGame-windows-x86_64.zip" windows-x86_64)
          (cd "$output" && sha256sum MyGame-linux-x86_64.tar.gz MyGame-windows-x86_64.zip > SHA256SUMS)

      - name: Upload desktop builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyGame-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/mygame-desktop/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Temporary diagnostic for #464. Remove before marking the PR ready.
  diagnose-linux:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 464 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/m0-desktop-build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: '20e616d8056143c33ddbeff44e200d946ac9f445'
      SOURCE_TREE: '0d8d709bf342127558c0fbb0db44ebd3850ff4d4'
      GODOT_VERSION: '4.7.2'
      TEMPLATE_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - name: Check out the failed export source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install GDB and record runner
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mygame-diagnostic-logs"
          mkdir -p "$logs"
          {
            cat /etc/os-release
            uname -m
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb binutils
            gdb --version
            readelf --version
          } 2>&1 | tee "$logs/setup.log"

      - name: Install verified Godot and Linux template
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          godot=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          version=$("$godot" --version)
          [[ "$version" == "$GODOT_VERSION.stable.official."* ]]
          template="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          archive="$RUNNER_TEMP/$template"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$template"
          printf '%s  %s\n' "$TEMPLATE_SHA256" "$archive" | sha256sum --check --strict

          # get_godot.sh installs the engine in self-contained mode.
          templates="$(dirname "$godot")/editor_data/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$templates"
          unzip -j "$archive" 'templates/linux_release.x86_64' -d "$templates"
          printf 'GODOT=%s\n' "$godot" >> "$GITHUB_ENV"

      - name: Capture original-source Linux export fault and terminal status
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mygame-diagnostic-logs"
          stage="$RUNNER_TEMP/mygame-diagnostic-stage"
          mkdir -p "$stage"
          finish() {
            result=$?
            trap - EXIT
            {
              test "$(git rev-parse HEAD)" = "$SOURCE_SHA" &&
              test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE" &&
              git diff --exit-code HEAD &&
              git diff --cached --exit-code &&
              test -z "$(git status --porcelain)" &&
              sha256sum game/project.godot &&
              echo "Original source/index guards passed"
            } >"$logs/source-guards.log" 2>&1 || result=1
            python3 - "$logs" <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          root = Path(sys.argv[1])
          limit = 16 * 1024 * 1024
          records = []
          for p in sorted(root.iterdir()):
              if not p.is_file():
                  continue
              data = p.read_bytes()
              records.append(f"{p.name} original_bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()} truncated={len(data) > limit}")
              if len(data) > limit:
                  marker = b"\n[TRUNCATED: retained head and tail; original digest in retention.log]\n"
                  half = (limit - len(marker)) // 2
                  p.write_bytes(data[:half] + marker + data[-half:])
          (root / "retention.log").write_text("\n".join(records) + "\n")
          PY
            exit "$result"
          }
          trap finish EXIT
          printf '%s  %s\n' \
            8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e "$GODOT" \
            | sha256sum --check --strict >"$logs/engine-identity.log"
          {
            readelf -h -n "$GODOT"
            sha256sum "$GODOT"
          } >>"$logs/engine-identity.log" 2>&1
          bash game/tools/fetch_limboai_release.sh >"$logs/limboai.log" 2>&1
          {
            sha256sum game/addons/limboai/bin/liblimboai.linux.editor.x86_64.so \
              game/addons/limboai/bin/liblimboai.linux.template_release.x86_64.so
            readelf -n game/addons/limboai/bin/liblimboai.linux.editor.x86_64.so
          } >"$logs/limboai-identity.log" 2>&1
          "$GODOT" --headless --path game --import >"$logs/import.log" 2>&1
          cat >"$stage/export.gdb" <<'GDB'
          set pagination off
          set confirm off
          set disable-randomization off
          handle SIGSEGV stop print pass
          handle SIGABRT nostop print pass
          run
          python
          capture_failed = False
          if gdb.selected_inferior().pid:
              for command in ("info files", "info proc mappings", "info sharedlibrary",
                              "info registers", "x/32i $pc-32", "x/32i 0x93820f",
                              "thread apply all bt full"):
                  try:
                      gdb.execute(command)
                  except gdb.error as error:
                      print("capture_error=" + str(error))
                      capture_failed = True
              gdb.execute("handle SIGSEGV nostop print pass")
              gdb.execute("continue")
          signal = gdb.parse_and_eval("$_exitsignal")
          code = gdb.parse_and_eval("$_exitcode")
          print("inferior_signal_raw=" + str(signal))
          print("inferior_exit_raw=" + str(code))
          if signal.type.code != gdb.TYPE_CODE_VOID:
              result = 128 + int(signal)
          elif code.type.code != gdb.TYPE_CODE_VOID:
              result = int(code)
          else:
              result = 125
          print("inferior_result=" + str(result))
          print("capture_failed=" + str(capture_failed))
          gdb.execute("quit %d" % (125 if capture_failed and result == 0 else result))
          end
          GDB
          status=0
          timeout --kill-after=10s 10m gdb --batch --nx -x "$stage/export.gdb" \
            --args "$GODOT" --headless --path game --export-release 'Linux x86_64' "$stage/MyGame" \
            >"$logs/linux-gdb.log" 2>&1 || status=$?
          printf 'diagnostic_status=%s\n' "$status" | tee "$logs/exit.txt"
          exit "$status"

      - name: Upload diagnostic logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyGame-linux-export-diagnostic
          path: ${{ runner.temp }}/mygame-diagnostic-logs/
          if-no-files-found: warn
          retention-days: 1
