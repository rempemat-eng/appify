name: Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The screens check guards layout (overflow, touch targets, safe areas), not the
    # art: art-only changes are covered by Art reproducibility and their PR previews, so
    # they don't spend a 9-minute run here (Matt, 19 Oct: keep CI minutes down without
    # lowering the bar).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'art/**'
      - 'scripts/art/**'
      - 'scripts/audio/**'
      - 'lib/zone-maps.ts'
      - 'lib/zone-assets.ts'
      - 'lib/garden-map.ts'
      - 'lib/decor-*.ts'
      - 'lib/journey-*.ts'
      - 'lib/world-maps.ts'
      - 'lib/*-sprites.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    # drafts wait until they are marked ready (ready_for_review starts the run)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      EXPO_OFFLINE: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BILT_URL: ''
      EXPO_PUBLIC_BILT_ANON_KEY: ''
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build and capture all screens
        run: npm run screens
      - name: Upload images and review gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napattack-screens-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: artifacts/screens/
          if-no-files-found: error
          retention-days: 7
