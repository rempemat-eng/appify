name: Screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      EXPO_OFFLINE: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BILT_URL: ''
      EXPO_PUBLIC_BILT_ANON_KEY: ''
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and capture all screens
        run: npm run screens
      - name: Upload images and review gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napattack-screens-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: artifacts/screens/
          if-no-files-found: error
          retention-days: 7
