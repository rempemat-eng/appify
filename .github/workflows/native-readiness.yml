name: Native readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_PLATFORM: native
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BILT_URL: ''
      EXPO_PUBLIC_BILT_ANON_KEY: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check Expo project health
        run: npx --yes expo-doctor@1.21.5
      - name: Generate iOS and Android projects
        run: npx expo prebuild --platform all --no-install
      - name: Check native project generation and tracked source
        run: |
          test -f ios/NapAttack.xcodeproj/project.pbxproj
          test -f android/app/build.gradle
          git diff --exit-code
