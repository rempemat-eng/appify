name: Native readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.config.ts'
      - 'eas.json'
      - 'public/icons/**'
      - '.github/workflows/native-readiness.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'daily' || 'change' }}
  cancel-in-progress: true

jobs:
  prebuild:
    # drafts wait until they are marked ready (ready_for_review starts the run)
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # The daily health-only run has a hard three-minute budget; no prebuild.
    timeout-minutes: ${{ github.event_name == 'schedule' && 3 || 15 }}
    env:
      CI: '1'
      EXPO_PLATFORM: native
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_BILT_URL: ''
      EXPO_PUBLIC_BILT_ANON_KEY: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Expo project health
        env:
          DOCTOR_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'strict' }}
          DOCTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node <<'NODE'
          // C54: compare complete findings, never just check names or exit codes.
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const { stripVTControlCharacters } = require('node:util');
          const version = '1.21.5';
          const env = { ...process.env, CI: '1', NO_COLOR: '1', EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: '0' };
          function command(file, args, cwd, timeout = 120000) {
            const result = spawnSync(file, args, { cwd, env, encoding: 'utf8', timeout, maxBuffer: 16 * 1024 * 1024 });
            if (result.error || result.signal || result.status === null) {
              throw new Error(`${file} did not complete: ${result.error || result.signal}`);
            }
            return { status: result.status, text: stripVTControlCharacters(`${result.stdout || ''}\n${result.stderr || ''}`) };
          }
          function report(result, root) {
            const text = result.text.split(root).join('<project>').replace(/\r/g, '');
            const summary = [...text.matchAll(/^(\d+)\/(\d+) checks passed\.(.*)$/gm)];
            assert.equal(summary.length, 1, 'Doctor must emit one complete check summary');
            const [, passed, total, tail] = summary[0];
            const failed = Number(total) - Number(passed);
            assert.ok(Number(total) > 0 && failed >= 0, 'Invalid doctor check count');
            assert.ok(!/Unexpected error while running|requires a connection to the Expo API/.test(text), 'Doctor infrastructure error');
            if (!failed) {
              assert.equal(result.status, 0, 'Successful summary with failing process');
              assert.match(tail, /No issues detected!/, 'Incomplete success summary');
              return [];
            }
            assert.equal(result.status, 1, 'Unexpected doctor exit status');
            assert.match(tail, new RegExp(` ${failed} checks failed\\. Possible issues detected:`));
            const details = text.slice(summary[0].index + summary[0][0].length);
            const end = details.search(/^\d+ checks? failed, indicating possible issues with the project\.$/m);
            assert.ok(end >= 0, 'Missing doctor failure footer');
            const blocks = [...details.slice(0, end).matchAll(/^✖ (.+)\n([\s\S]*?)(?=^✖ |$(?![\s\S]))/gm)];
            assert.equal(blocks.length, failed, 'Missing doctor finding details');
            const findings = blocks.map(([, name, body]) => {
              const issue = body.split(/^Advice:\s*$/m)[0].trim().replace(/[ \t]+/g, ' ');
              assert.ok(issue, `Empty finding: ${name}`);
              return `${name.trim()}\n${issue}`;
            });
            assert.equal(new Set(findings).size, findings.length, 'Duplicate doctor findings');
            return findings;
          }
          function compare(base, head) {
            return { added: head.filter((finding) => !base.includes(finding)), inherited: head.filter((finding) => base.includes(finding)), fixed: base.filter((finding) => !head.includes(finding)) };
          }
          function selfTest() {
            const clean = { status: 0, text: '2/2 checks passed. No issues detected!' };
            const bad = (issue) => ({ status: 1, text: `Running 2 checks on your project...\n✖ Dependencies\n✔ Config\n\n1/2 checks passed. 1 checks failed. Possible issues detected:\n\n✖ Dependencies\n${issue}\nAdvice:\nUpgrade.\n\n1 check failed, indicating possible issues with the project.` });
            const base = report(bad('expo expected ~57.0.31, found 57.0.30'), '/base');
            assert.equal(compare(base, report(clean, '/head')).added.length, 0);
            assert.equal(compare(base, report(clean, '/head')).fixed.length, 1);
            assert.equal(compare(base, report(bad('expo expected ~57.0.31, found 57.0.30'), '/head')).inherited.length, 1);
            assert.equal(compare(base, report(bad('expo expected ~57.0.31, found 56.0.0'), '/head')).added.length, 1);
            assert.equal(compare([], base).added.length, 1);
            assert.equal(report(clean, '/head').length, 0);
            assert.throws(() => report({ ...clean, status: 1 }, '/head'));
            assert.throws(() => report({ status: 1, text: 'Network request failed' }, '/head'));
            assert.throws(() => report({ ...bad('issue'), text: bad('issue').text.replace('✖ Dependencies\nissue', 'issue') }, '/head'));
            assert.throws(() => report({ ...bad('issue'), text: bad('issue').text + '\nUnexpected error while running check:' }, '/head'));
            console.log('Doctor comparison controls: 10 passed.');
          }
          selfTest();
          // Run doctor only after its parser and comparison controls pass.
          function doctor(root, label) {
            const result = command('npx', ['--yes', `expo-doctor@${version}`, '--verbose'], root);
            console.log(`--- ${label}: expo-doctor@${version} (exit ${result.status}) ---\n${result.text}`);
            return report(result, root);
          }
          function summary(text) {
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          }
          function annotation(kind, text) {
            console.log(`::${kind}::${text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')}`);
          }
          try {
            const root = process.cwd();
            let base = [];
            if (process.env.DOCTOR_MODE === 'pr') {
              assert.match(process.env.DOCTOR_BASE_SHA || '', /^[a-f0-9]{40}$/, 'Missing PR base SHA');
              const merge = command('git', ['merge-base', 'HEAD', process.env.DOCTOR_BASE_SHA], root);
              assert.equal(merge.status, 0, 'Cannot resolve actual merge base');
              const sha = merge.text.trim();
              assert.match(sha, /^[a-f0-9]{40}$/);
              const baseRoot = path.join(fs.mkdtempSync(path.join(os.tmpdir(), 'native-doctor-')), 'base');
              const checkout = command('git', ['worktree', 'add', '--detach', baseRoot, sha], root);
              assert.equal(checkout.status, 0, checkout.text);
              console.log(`Doctor baseline: ${sha}`);
              const install = command('npm', ['ci'], baseRoot);
              console.log(install.text);
              assert.equal(install.status, 0, 'Baseline dependency installation failed');
              base = doctor(baseRoot, 'merge base');
            } else {
              assert.equal(process.env.DOCTOR_MODE, 'strict', 'Unknown doctor mode');
            }
            const head = doctor(root, process.env.DOCTOR_MODE === 'pr' ? 'PR head' : 'current main/manual head');
            const result = compare(base, head);
            summary(`## Expo doctor\nMode: ${process.env.DOCTOR_MODE}; pinned doctor ${version}.\n\nBaseline findings: ${base.length}; head findings: ${head.length}; new/changed: ${result.added.length}; inherited: ${result.inherited.length}; fixed: ${result.fixed.length}.`);
            if (base.length) annotation('warning', `Merge-base Expo health has ${base.length} finding(s), including any upstream SDK patch drift. Unchanged/fixed findings do not block this PR; Claude A owns the dependency update. See complete doctor logs.`);
            for (const finding of result.added) annotation('error', `New/changed Expo doctor finding:\n${finding}`);
            assert.equal(result.added.length, 0, 'Expo doctor introduced findings (strict runs gate every finding)');
          } catch (error) {
            summary(`## Expo doctor failed\n${String(error)}`);
            annotation('error', String(error));
            process.exitCode = 1;
          }
          NODE
      - name: Generate iOS and Android projects
        if: github.event_name != 'schedule'
        run: npx expo prebuild --platform all --no-install
      - name: Check native project generation and tracked source
        if: github.event_name != 'schedule'
        run: |
          test -f ios/NapAttack.xcodeproj/project.pbxproj
          test -f android/app/build.gradle
          git diff --exit-code
