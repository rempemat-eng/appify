name: Highgarth concept metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'game/data/kit/concepts/highgarth_*.json'
      - 'scripts/highgarth/**'
      - 'docs/codex/highgarth-kit.md'
      - '.github/workflows/highgarth-concepts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concepts:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install concept-check dependency
        run: python -m pip install -r scripts/highgarth/requirements.txt
      - name: Exercise invalid packets and check proposal metadata
        run: |
          python -m unittest scripts.highgarth.test_check
          python -m scripts.highgarth.check --json
