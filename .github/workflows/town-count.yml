name: Town count metadata
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/review/town_plan.py'
      - 'scripts/review/test_town_count.py'
      - 'docs/vision/research/blockout/towns/**'
      - 'docs/vision/research/blockout/blockout-v55.json'
      - '.github/workflows/town-count.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review/town_plan.py'
      - 'scripts/review/test_town_count.py'
      - 'docs/vision/research/blockout/towns/**'
      - 'docs/vision/research/blockout/blockout-v55.json'
      - '.github/workflows/town-count.yml'
permissions:
  contents: read
jobs:
  count:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.5.3' 'scipy==1.18.1'
      - run: python -m unittest scripts.review.test_town_count -v
