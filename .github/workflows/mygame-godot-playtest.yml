name: Godot playtest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'game/**'
      - '.github/workflows/mygame-godot-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/mygame-godot-playtest.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playtest:
    # Drafts wait for ready_for_review. Failures remain visible but do not block merges.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install Xvfb and Mesa software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Get the pinned Godot (checked against its SHA-512)
        run: |
          GODOT=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
      - name: Play all three routes with the existing debug runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/reports/playtest
          npm run playtest:godot 2>&1 | tee game/reports/playtest/workflow.log
      - name: Upload playtest reports even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-playtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: game/reports/playtest
          if-no-files-found: warn
          retention-days: 7
