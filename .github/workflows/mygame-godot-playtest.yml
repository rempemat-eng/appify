name: Godot playtest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'game/**'
      - '.github/workflows/mygame-godot-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/mygame-godot-playtest.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      routes: ${{ steps.routes.outputs.routes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover the existing routes
        id: routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          routes = sorted(p.stem for p in Path("game/tools/routes").glob("*.txt"))
          if not routes:
              raise SystemExit("No playtest routes found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("routes=" + json.dumps(routes) + "\n")
          PY

  playtest:
    needs: routes
    name: Play ${{ matrix.route }}
    # Each route keeps the existing non-blocking policy; sibling failures do not cancel evidence.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        route: ${{ fromJSON(needs.routes.outputs.routes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      ROUTE: ${{ matrix.route }}
      PLAYTEST_OUT: ${{ github.workspace }}/game/reports/playtest/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install Xvfb and Mesa software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Get the pinned Godot (checked against its SHA-512)
        run: |
          GODOT=$(bash game/tools/get_godot.sh "$RUNNER_TEMP/godot")
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
      - name: Play this route with the existing debug runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLAYTEST_OUT"
          date +%s > "$PLAYTEST_OUT/$ROUTE.started"
          npm run playtest:godot -- "game/tools/routes/$ROUTE.txt" 2>&1 | tee "$PLAYTEST_OUT/$ROUTE.workflow.log"
      - name: Report this route result
        if: always()
        shell: bash
        run: |
          result="$PLAYTEST_OUT/$ROUTE/result.txt"
          {
            echo "### Route: $ROUTE"
            if [ -f "$result" ]; then
              cat "$result"
            else
              echo "No route result was produced; inspect setup and workflow logs."
            fi
            if [ -f "$PLAYTEST_OUT/$ROUTE.started" ]; then
              started=$(cat "$PLAYTEST_OUT/$ROUTE.started")
              echo "Route step elapsed: $(( $(date +%s) - started )) seconds."
            fi
            echo "Run and attempt: $GITHUB_RUN_ID / $GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload this route reports even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-playtest-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: game/reports/playtest
          if-no-files-found: warn
          retention-days: 7
