<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a1c">
<title>NapAttack Turns</title>
<style>
  :root { --bg: #1b2a1c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #f3e6c8; font: 14px monospace; }
</style>
</head>
<body>
<canvas id="c" aria-label="NapAttack fight prototype: in-world turns"></canvas>
<div id="safe"></div>
<div id="boot">loading the woodland...</div>
<script>
'use strict';
const A = __ASSETS__;

/* ============================================================================================
   NapAttack prototype: in-world, turn-based fights (MOCK). One file, canvas, touch first.
   World art is drawn at 1 art px on an offscreen canvas, then scaled by a whole number of
   device px (k) so the pixel grid never blurs. Interface is drawn in device px on top.
   ============================================================================================ */

// ---------- settings (per viewer, in browser storage, safe if storage is missing) -------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('napattack-turns:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('napattack-turns:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const prefersReduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const Q = new URLSearchParams(location.search);
const settings = {
  timing: store.get('timing', 'TAP'),            // TAP (160 ms), RELAXED (320 ms), OFF
  shake: store.get('shake', !prefersReduced),
  reduced: store.get('reduced', prefersReduced),
};
if (Q.get('reduced') === '1') settings.reduced = true;
const saveSettings = () => { store.set('timing', settings.timing); store.set('shake', settings.shake); store.set('reduced', settings.reduced); };
const WINDOW = { TAP: 160, RELAXED: 320, OFF: 0 };

// ---------- random (seedable for tests) -----------------------------------------------------
let seed = Number(Q.get('seed')) || (Date.now() % 100000) + 1;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));

// ---------- canvas and layout --------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const art = document.createElement('canvas');
const actx = art.getContext('2d');
let dpr = 1, SW = 402, SH = 874, W = 402, H = 874;
let safe = { t: 0, r: 0, b: 0, l: 0 };
let U = 1;  // device px per frame unit (1.33 css px)
function resize() {
  dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  SW = window.innerWidth; SH = window.innerHeight;
  W = Math.round(SW * dpr); H = Math.round(SH * dpr);
  cv.width = W; cv.height = H; cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  const cs = getComputedStyle(document.getElementById('safe'));
  safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  U = Math.max(1, Math.round(dpr * 4 / 3));
  if (cam && !camAnim) cam.k = mode === 'walk' ? kWalk() : kFight();
}
const d = (v) => Math.round(v * dpr);           // css px -> device px
const kWalk = () => Math.max(1, Math.ceil(H / 576), Math.ceil(W / 320));
const kFight = () => Math.max(kWalk() + 1, Math.floor(W / 120));

// ---------- images ---------------------------------------------------------------------------
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const IMG = {};
async function loadAll() {
  const jobs = [['ground', A.ground], ['flow', A.flow], ['bramble', A.bramble.img], ['moss', A.moss.img],
    ['glare', A.glare.img], ['storm', A.storm.img], ['icons', A.icons.img]];
  for (const [k, v] of Object.entries(A.props)) jobs.push(['prop:' + k, v]);
  await Promise.all(jobs.map(async ([k, s]) => { IMG[k] = await loadImg(s); }));
  const fonts = [['PxBold', A.pxBold], ['PxMed', A.pxMed], ['PxDisplay', A.pxDisplay]];
  await Promise.all(fonts.map(async ([n, s]) => { try { const f = new FontFace(n, `url(${s})`); await f.load(); document.fonts.add(f); } catch (e) { /* fallback font */ } }));
  // a water mask from the ground's own blue pixels (for reflections)
  const g = IMG.ground;
  const m = document.createElement('canvas'); m.width = g.width; m.height = g.height;
  const mc = m.getContext('2d'); mc.drawImage(g, 0, 0);
  const id = mc.getImageData(0, 0, m.width, m.height);
  for (let i = 0; i < id.data.length; i += 4) {
    const r = id.data[i], gg = id.data[i + 1], b = id.data[i + 2];
    const water = b > r + 40 && b > gg + 10;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = 255; id.data[i + 3] = water ? 255 : 0;
  }
  mc.putImageData(id, 0, 0);
  IMG.waterMask = m;
}

// ---------- the walk grid (4 px cells) -------------------------------------------------------
const GW = 80, GH = 144, CELL = 4;
const walkable = (x, y) => { const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL); return cx >= 0 && cy >= 0 && cx < GW && cy < GH && A.walk[cy][cx] === '.'; };
const isWater = (x, y) => { const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL); return cx >= 0 && cy >= 0 && cx < GW && cy < GH && A.water[cy][cx] === 'w'; };
const BR = A.bridge;
const onBridge = (x, y) => x >= BR[0] - 1 && x <= BR[2] + 1 && y >= BR[1] && y <= BR[3];
function nearestOpen(x, y, maxR = 8) {
  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  for (let r = 0; r <= maxR; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const X = cx + dx, Y = cy + dy;
    if (X >= 0 && Y >= 0 && X < GW && Y < GH && A.walk[Y][X] === '.') return [X * CELL + 2, Y * CELL + 2];
  }
  return null;
}
function lineClear(x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2);
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; if (!walkable(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; }
  return true;
}
function findPath(sx, sy, tx, ty) {
  const s = nearestOpen(sx, sy, 3), t = nearestOpen(tx, ty, 8);
  if (!s || !t) return null;
  const S = [Math.floor(s[0] / CELL), Math.floor(s[1] / CELL)], T = [Math.floor(t[0] / CELL), Math.floor(t[1] / CELL)];
  const key = (x, y) => y * GW + x;
  const g = new Map(), came = new Map(), open = [[0, S[0], S[1]]];
  g.set(key(S[0], S[1]), 0);
  const h = (x, y) => Math.hypot(x - T[0], y - T[1]);
  let found = false, iter = 0;
  while (open.length && iter++ < 20000) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
    const [, x, y] = open.splice(bi, 1)[0];
    if (x === T[0] && y === T[1]) { found = true; break; }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const X = x + dx, Y = y + dy;
      if (X < 0 || Y < 0 || X >= GW || Y >= GH || A.walk[Y][X] !== '.') continue;
      if (dx && dy && (A.walk[y][X] !== '.' || A.walk[Y][x] !== '.')) continue;
      const ng = g.get(key(x, y)) + (dx && dy ? 1.414 : 1);
      if (ng < (g.get(key(X, Y)) ?? Infinity)) { g.set(key(X, Y), ng); came.set(key(X, Y), key(x, y)); open.push([ng + h(X, Y), X, Y]); }
    }
  }
  if (!found) return null;
  const pts = []; let k = key(T[0], T[1]);
  while (k !== undefined) { pts.push([(k % GW) * CELL + 2, Math.floor(k / GW) * CELL + 2]); k = came.get(k); }
  pts.reverse();
  pts[pts.length - 1] = [t[0], t[1]];
  // string pulling: keep only the turns the line of sight needs
  const out = [pts[0]]; let i = 0;
  while (i < pts.length - 1) {
    let j = pts.length - 1;
    while (j > i + 1 && !lineClear(pts[i][0], pts[i][1], pts[j][0], pts[j][1])) j--;
    out.push(pts[j]); i = j;
  }
  return out.slice(1);
}

// ---------- clocks, timers, tweens ---------------------------------------------------------
let gt = 0, hitStop = 0, lastReal = 0;
const timers = [], tweens = [];
const wait = (ms) => new Promise((r) => timers.push({ t: gt + ms, r }));
const nowR = () => performance.now();
function tween(ms, fn, ease = easeInOut) {
  return new Promise((r) => { const tw = { t0: gt, ms: Math.max(1, ms), fn, ease, r }; tweens.push(tw); fn(0); });
}
const realWaiters = [];
const waitReal = (ms) => new Promise((r) => realWaiters.push({ t: nowR() + ms, r }));
const easeInOut = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function step(dtReal) {
  if (hitStop > 0) { hitStop -= dtReal; return; }
  gt += dtReal;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= gt) { const t = timers.splice(i, 1)[0]; t.r(); }
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; const p = Math.min(1, (gt - tw.t0) / tw.ms);
    tw.fn(tw.ease(p)); if (p >= 1) { tweens.splice(i, 1); tw.r(); }
  }
}

// ---------- characters ---------------------------------------------------------------------
const BA = A.bramble;
const bram = {
  x: 126, y: 152, face: 'S', act: 'idle', t0: 0, loop: true, path: [], hp: 80, max: 80,
  aim: 0, guard: false, energy: 1, hop: 0, sit: false, ox: 0, oy: 0,
};
function anim(ch, act, face, loop = false) {
  ch.act = act; if (face) ch.face = face; ch.t0 = gt; ch.loop = loop;
  if (loop) return Promise.resolve();
  const ms = BA.actions[act].reduce((a, b) => a + b, 0);
  return wait(ms);
}
function bramFrame() {
  const ms = BA.actions[bram.act]; let n = 0;
  if (settings.reduced && (bram.act === 'idle' || bram.act === 'sleep')) n = 0;
  else {
    const total = ms.reduce((a, b) => a + b, 0);
    let t = gt - bram.t0; if (bram.loop) t %= total; else if (t >= total) t = total - 1;
    let acc = 0; for (n = 0; n < ms.length; n++) { acc += ms[n]; if (t < acc) break; }
    n = Math.min(n, ms.length - 1);
  }
  let face = bram.face;
  const facings = { attack: 'EW', cast: 'EW', hit: 'EW', faint: 'EW', lie: 'EW', sleep: 'EW', wake: 'EW', happy: 'S', victory: 'S' }[bram.act];
  if (facings && !facings.includes(face)) face = facings.includes('E') ? (face === 'W' ? 'W' : 'E') : 'S';
  return `${bram.act}_${face}_${n}`;
}
const relFrame = (act, n) => BA.actions[act].slice(0, n).reduce((a, b) => a + b, 0);

const moss = { x: 134, y: 150, face: 'E', moving: false, t0: 0, hop: 0, act: 'walk', mode: 'follow', tx: 0, ty: 0 };
const trail = [];  // Bramble's recent foot points, for Moss to follow a step behind

// foes: field Glares and the arena's Static Storm (its knot, then a core and two shards)
let foes = [];
function makeGlare() {
  return { kind: 'glare', name: 'GLARE', x: 304, y: 270, hp: 48, max: 48, state: 'drift', route: glareRoute(), ri: 0,
    linger: 0, alpha: 0, dx: 0, dy: 0, big: false, squint: 0, flash: 0, guard: false, intent: null, calm: false,
    fold: 0, cool: 0, hoverH: 14, motes: [] };
}
function glareRoute() {
  // drifts in from the east along the stream, lingers near the path, then drifts on west
  return [[250, 276], [208, 282], [172, 278, 9000], [150, 274], [118, 282], [84, 286], [46, 290], [10, 286]];
}

// ---------- the world's markers --------------------------------------------------------------
const RING = { cx: 80, cy: 410, rx: 30, ry: 16 };       // the stone ring's grass (the arena)
const SIGN = { x: 163, y: 366 };
let storm = null;  // set when the arena holds its special foe
let stormBack = 0;
function makeStorm() {
  return { kind: 'knot', name: 'STATIC STORM', x: 66, y: 394, hp: 100, max: 100, state: 'wait', alpha: 1, dx: 0, dy: 0,
    big: false, squint: 0, flash: 0, guard: false, intent: null, calm: false, fold: 0, hoverH: 16, phase: 1, cycle: 0, motes: [] };
}

// ---------- game state -----------------------------------------------------------------------
let mode = 'boot';            // boot, walk, intro, fight, outro
let fight = null;
let ui = { hud: 1, fight: 0 };
let overlay = null;            // 'howto' | 'settings' | null
let toasts = [], pops = [], fx = [], banners = [];
let nextGlareAt = 2500;
let shake = { a: 0, t: 0 };
let screenFlash = 0;
const cam = { x: 160, y: 200, k: 5 };
let camAnim = null;
let ringSeen = false;
const stats = { nice: 0, none: 0, missed: 0 };

// ---------- input ----------------------------------------------------------------------------
let buttons = [];            // rebuilt each frame: {id, x, y, w, h, on, fn}
let pressed = null;          // {id, x, y}
let downInfo = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  // a timed tap counts anywhere on screen, once, during a shot
  if (fight && fight.timing && fight.timing.open && fight.timing.tap === null) { fight.timing.tap = nowR(); return; }
  const b = hitButton(x, y);
  pressed = b ? { id: b.id } : null;
  downInfo = { x, y, t: nowR(), b };
});
cv.addEventListener('pointerup', (e) => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  const di = downInfo; downInfo = null; pressed = null;
  if (!di) return;
  const b = hitButton(x, y);
  if (di.b) { if (b && b.id === di.b.id && b.on) b.fn(); return; }
  if (Math.hypot(x - di.x, y - di.y) > 18) return;
  if (overlay) return;
  worldTap(x, y);
});
cv.addEventListener('pointercancel', () => { pressed = null; downInfo = null; });
function hitButton(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
function btn(id, x, y, w, h, on, fn) { buttons.push({ id, x, y, w, h, on, fn }); return pressed && pressed.id === id && on; }

// world <-> screen (css px)
let view = { ix: 0, iy: 0, offX: 0, offY: 0, k: 5 };
const toScreen = (x, y) => [((x - view.ix) * view.k + view.offX) / dpr, ((y - view.iy) * view.k + view.offY) / dpr];
const toWorld = (sx, sy) => [(sx * dpr - view.offX) / view.k + view.ix, (sy * dpr - view.offY) / view.k + view.iy];

function worldTap(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  if (mode === 'walk') {
    // a tap on a Glare or the Storm walks to meet it (hit area at least 44 css px)
    const rad = Math.max(14, 24 / (view.k / dpr));
    for (const f of foes) if (f.state === 'drift' && f.alpha > 0.5 && Math.hypot(wx - f.x, wy - f.y) < rad) { walkTo(f.x, f.y + f.hoverH); return; }
    if (storm && storm.state === 'wait' && Math.hypot(wx - storm.x, wy - storm.y) < rad + 8) { walkTo(104, 414); return; }
    walkTo(wx, wy, true);
    return;
  }
  if (mode === 'fight' && fight && fight.awaiting) {
    const rad = Math.max(12, 24 / (view.k / dpr));
    // tap a foe to aim at it
    for (const f of fight.foes) if (f.hp > 0 && Math.hypot(wx - f.x, wy - f.y) < rad + 4) { fight.target = f; return; }
    // tap a marked standing spot to choose a step there
    for (const s of fight.spots) if (Math.hypot(wx - s.x, wy - s.y) < rad) { fight.sel = { kind: 'step', spot: s }; return; }
  }
}
function walkTo(x, y, mark) {
  const p = findPath(bram.x, bram.y, x, y);
  if (!p || !p.length) return;
  bram.path = p;
  if (mark) { const e = p[p.length - 1]; fx.push({ type: 'tapmark', x: e[0], y: e[1], t0: gt, ms: 500 }); }
}

// ---------- the update loop -------------------------------------------------------------------
function update(dt) {
  // Bramble walks his path
  if (bram.path.length && (mode === 'walk' || bram.scripted)) {
    const [tx, ty] = bram.path[0];
    const dx = tx - bram.x, dy = ty - bram.y, dist = Math.hypot(dx, dy);
    let remain = dist; for (let i = 1; i < bram.path.length; i++) remain += Math.hypot(bram.path[i][0] - bram.path[i - 1][0], bram.path[i][1] - bram.path[i - 1][1]);
    const run = remain > 40;
    const sp = (run ? 50 : 20) * dt / 1000;
    const face = Math.abs(dx) > Math.abs(dy) * 0.9 ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N');
    const act = run ? 'run' : 'walk';
    if (bram.act !== act) anim(bram, act, face, true); else bram.face = face;
    if (dist <= sp) { bram.x = tx; bram.y = ty; bram.path.shift(); } else { bram.x += dx / dist * sp; bram.y += dy / dist * sp; }
    if (!bram.path.length) anim(bram, 'idle', bram.face === 'N' ? 'N' : bram.face, true);
  }
  // Moss's trail
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(last[0] - bram.x, last[1] - bram.y) >= 1) trail.push([bram.x, bram.y]);
  if (trail.length > 200) trail.shift();
  if (moss.mode === 'follow') {
    let acc = 0, target = trail[0];
    for (let i = trail.length - 1; i > 0; i--) { acc += Math.hypot(trail[i][0] - trail[i - 1][0], trail[i][1] - trail[i - 1][1]); if (acc >= 17) { target = trail[i - 1]; break; } }
    if (acc < 17) target = null;
    // a step behind and a little to the side, so Bramble never hides it
    if (target) moveMoss(target[0] + 6, target[1] + 3, dt, 60);
    else moss.moving = false;
  } else if (moss.mode === 'place') {
    moveMoss(moss.tx, moss.ty, dt, 40);
  }
  // foes drift
  for (const f of foes) updateFoe(f, dt);
  foes = foes.filter((f) => f.state !== 'gone');
  if (mode === 'walk') {
    if (gt > nextGlareAt && !foes.some((f) => f.kind === 'glare')) spawnGlare();
    // meeting a Glare starts a fight right there
    for (const f of foes) {
      if (f.state === 'drift' && f.alpha > 0.8 && gt > f.cool && Math.hypot(bram.x - f.x, bram.y - (f.y + f.hoverH)) < 22) { startField(f); break; }
    }
    // the ring: step inside to spar with the Storm
    if (mode === 'walk' && storm && storm.state === 'wait') {
      const inRing = ((bram.x - RING.cx) / RING.rx) ** 2 + ((bram.y - RING.cy) / RING.ry) ** 2 < 1;
      if (inRing) startArena();
    }
    if (!ringSeen && Math.hypot(bram.x - SIGN.x, bram.y - SIGN.y) < 60) {
      ringSeen = true; banner('THE STONE RING', 'A STATIC STORM WAITS INSIDE. STEP IN TO SPAR, OR WALK ON.', 'night', 3600);
    }
    if (!storm && gt > stormBack) { storm = makeStorm(); }
  }
  if (storm && !foes.includes(storm)) foes.push(storm);
  // camera
  if (camAnim) {
    const p = Math.min(1, (gt - camAnim.t0) / camAnim.ms), e = easeInOut(p);
    cam.x = lerp(camAnim.from.x, camAnim.to.x, e); cam.y = lerp(camAnim.from.y, camAnim.to.y, e);
    cam.k = Math.round(lerp(camAnim.from.k, camAnim.to.k, e));
    if (p >= 1) { const r = camAnim.r; camAnim = null; r(); }
  } else if (mode === 'walk') {
    cam.k = kWalk();
    const t = Math.min(1, dt * 0.006);
    cam.x = lerp(cam.x, bram.x, t); cam.y = lerp(cam.y, bram.y - 12, t);
  }
  clampCam();
  // ui slides
  const uiT = Math.min(1, dt / (settings.reduced ? 1 : 220));
  const hudWant = mode === 'walk' && !camAnim ? 1 : 0, fightWant = (mode === 'fight') ? 1 : 0;
  ui.hud = settings.reduced ? hudWant : clamp(ui.hud + Math.sign(hudWant - ui.hud) * uiT, 0, 1);
  ui.fight = settings.reduced ? fightWant : clamp(ui.fight + Math.sign(fightWant - ui.fight) * uiT, 0, 1);
  if (shake.a > 0) shake.a = Math.max(0, shake.a - dt * 0.03);
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt / 160);
}
function clampCam() {
  const vw = W / cam.k, vh = H / cam.k;
  cam.x = vw >= 320 ? 160 : clamp(cam.x, vw / 2, 320 - vw / 2);
  cam.y = vh >= 576 ? 288 : clamp(cam.y, vh / 2, 576 - vh / 2);
}
function camTo(x, y, k, ms) {
  if (settings.reduced) ms = 1;
  return new Promise((r) => { camAnim = { from: { x: cam.x, y: cam.y, k: cam.k }, to: { x, y, k }, t0: gt, ms, r }; });
}
function moveMoss(tx, ty, dt, speed) {
  const dx = tx - moss.x, dy = ty - moss.y, dist = Math.hypot(dx, dy);
  if (dist > 60) { moss.x = tx; moss.y = ty; return; }
  if (dist < 0.6) { if (moss.moving) { moss.moving = false; } return; }
  const sp = Math.min(dist, speed * dt / 1000 * (dist > 20 ? 1.6 : 1));
  moss.x += dx / dist * sp; moss.y += dy / dist * sp;
  if (Math.abs(dx) > 0.5) moss.face = dx > 0 ? 'E' : 'W';
  if (!moss.moving) { moss.moving = true; moss.t0 = gt; }
}

function spawnGlare() {
  const g = makeGlare();
  foes.push(g);
  banner('A GLARE DRIFTED IN FROM THE CITY', 'IT DRIFTS ALONG THE STREAM. MEET IT TO SPAR, OR WALK ON.', 'night', 3400);
}
function updateFoe(f, dt) {
  if (f.kind === 'glare' && f.state === 'drift') {
    f.alpha = Math.min(1, f.alpha + dt / 900);
    const wp = f.route[f.ri];
    if (!wp) { f.alpha -= dt / 600; if (f.alpha <= 0) { f.state = 'gone'; nextGlareAt = gt + 6000; } return; }
    if (f.linger > 0) { f.linger -= dt; return; }
    const dx = wp[0] - f.x, dy = wp[1] - f.y, dist = Math.hypot(dx, dy);
    const sp = 14 * dt / 1000;
    if (dist <= sp) { f.x = wp[0]; f.y = wp[1]; f.ri++; if (wp[2]) f.linger = wp[2]; } else { f.x += dx / dist * sp; f.y += dy / dist * sp; }
  }

  if (!settings.reduced && (f.state === 'drift' || f.state === 'home') && rand() < dt / 260) f.motes.push({ x: f.x + ri(4, 10), y: f.y + ri(-2, 8), t0: gt });

// ---------- banners, pops, effects ------------------------------------------------------------
function banner(title, sub, tone = 'night', ms = 2400) { banners = banners.filter((b) => b.title !== title); banners.push({ title, sub, tone, t0: gt, ms }); }
function pop(x, y, text, color = '#FFFDF5', size = 16, opt = {}) { pops.push({ x, y, text, color, size, t0: gt, ms: opt.ms || 900, rise: opt.rise ?? 14, kind: opt.kind || 'num' }); }
function doShake(a) { if (settings.shake && !settings.reduced) shake.a = Math.max(shake.a, a); }
function flashScreen(a) { if (!settings.reduced) screenFlash = Math.max(screenFlash, a); }

/* ============================================================================================
   THE FIGHT ENGINE: today's card engine kept simple (lib/battle.ts, lib/cards.ts)
   energy +1 a turn (cap 3), a hand of 4 (level 2) drawn from a shuffled deck, one action a turn,
   pass for energy, guard halves the next hit, the 12-turn limit. Bramble's Steady: end a turn
   with energy left (or BE STILL, or TAKE COVER) for +1 Aim, at most one a turn, up to 3.
   ============================================================================================ */
const LEVEL = 2;
const CARDS = {
  loose: { name: 'LOOSE', cost: 1, power: 9, perAim: 4, arrow: true, icon: 'loose', line: '9 + 4 PER AIM' },
  longshot: { name: 'LONG SHOT', cost: 2, power: 12, perAim: 5, arrow: true, pierce: true, icon: 'longshot', line: '12 + 5 PER AIM, IGNORES GUARD' },
  cover: { name: 'TAKE COVER', cost: 1, guard: true, icon: 'cover', line: 'GUARD: HALVES THE NEXT HIT. +1 AIM' },
  stretch: { name: 'STRETCH', cost: 0, power: 8, icon: 'stretch', line: '8, A GUST OF LIGHT' },
};
const DECK = ['loose', 'loose', 'loose', 'longshot', 'longshot', 'cover', 'cover', 'stretch', 'stretch'];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function drawHand(F) {
  while (F.hand.length < 4) {
    if (!F.draw.length) { if (!F.discard.length) break; F.draw = shuffle(F.discard); F.discard = []; }
    F.hand.push(F.draw.pop());
  }
}
const TERRAIN = {
  bridge: { name: 'FOOTBRIDGE', short: 'BRIDGE', line: 'HIGH AND STEADY: ARROWS +3' },
  shade: { name: 'TREE SHADE', short: 'SHADE', line: 'OUT OF ITS GLARE: ITS HITS -3' },
  bank: { name: 'STREAM BANK', short: 'BANK', line: 'COOL WATER: +4 HP EACH TURN' },
  stone: { name: "STONE'S LEE", short: 'LEE', line: 'IN THE STONE\'S SHELTER: ITS HITS -3' },
  mark: { name: 'THE MARK', short: 'MARK', line: 'THE RING\'S OPEN GROUND' },
};
const TREE_KINDS = new Set(['oak', 'beech', 'birch', 'pine', 'willow', 'hollow_tree']);
function terrainAt(x, y) {
  if (fight && fight.kind === 'arena') { const s = fight.spotDefs.find((s) => Math.hypot(s.x - x, s.y - y) < 4); return s ? s.type : 'mark'; }
  if (onBridge(x, y)) return 'bridge';
  for (const o of A.objects) {
    if (!TREE_KINDS.has(o[1])) continue;
    const tx = o[2] + o[4] / 2, foot = o[3] + o[5];
    if (Math.abs(x - tx) < 14 && y > foot - 10 && y < foot + 12) return 'shade';
  }
  for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4; if (isWater(x + Math.cos(ang) * 7, y + Math.sin(ang) * 6)) return 'bank'; }
  return null;
}

function newFighter() {
  return { hand: [], draw: shuffle(DECK), discard: [], energy: 1, nextEnergy: 0, banked: false };
}

// --------- foe intents --------------------------------------------------------------------
function glareIntent(f) {
  const r = rand();
  if (!f.intent) return { type: 'hit', n: 7, name: 'DAZZLE', icon: 'sun' };
  if (f.intent.type !== 'guard' && r < 0.2) return { type: 'guard', name: 'FLICKER', icon: 'cover', note: 'HALVES YOUR NEXT HIT' };
  if (f.hp < f.max * 0.6 && !f.healed && r < 0.45) { f.healed = true; return { type: 'heal', n: 6, name: 'GLOW UP', icon: 'sun', note: '+6 BRIGHTNESS' }; }
  return { type: 'hit', n: 7, name: 'DAZZLE', icon: 'sun' };
}
function stormIntent(f) {
  if (f.kind === 'knot') {
    const cyc = ['crackle', 'gather', 'sweep', 'shield'][f.cycle++ % 4];
    if (cyc === 'crackle') return { type: 'hit', n: 6, name: 'CRACKLE', icon: 'sun' };
    if (cyc === 'shield') return { type: 'guard', name: 'STATIC SHIELD', icon: 'cover', note: 'HALVES YOUR NEXT HIT' };
    if (cyc === 'gather') return { type: 'gather', name: 'GATHER', icon: 'energy', note: 'A SWEEP COMES NEXT' };
    return { type: 'sweep', n: 18, name: 'STORM SWEEP', icon: 'energy', big: true, note: 'STEP OUT OF THE LANE OR TAKE COVER' };
  }
  if (f.kind === 'core') {
    const cyc = ['charge', 'charge', 'overload', 'crackle'][f.cycle++ % 4];
    if (cyc === 'charge') { const left = f.cycle % 4 === 1 ? 2 : 1; return { type: 'charge', name: 'CHARGING', icon: 'energy', count: left, note: `OVERLOAD IN ${left + 1}`, big: true }; }
    if (cyc === 'overload') return { type: 'hit', n: 20, name: 'OVERLOAD', icon: 'energy', big: true, note: 'TAKE COVER OR LET MOSS HUM' };
    return { type: 'hit', n: 6, name: 'CRACKLE', icon: 'sun' };
  }
  return { type: 'hit', n: 4, name: 'ZAP', icon: 'sun' };  // a shard
}
const chooseIntent = (f) => (f.kind === 'glare' ? glareIntent(f) : stormIntent(f));

function incoming(f, it) {
  if (!it || (it.type !== 'hit' && it.type !== 'sweep')) return null;
  let n = it.n;
  if (f.kind === 'glare' && isWater(f.x, f.y + f.hoverH)) n += 2;
  const ter = terrainAt(bram.x, bram.y);
  if (ter === 'shade' || ter === 'stone') n -= 3;
  return Math.max(1, n);
}

function hitRange(cardId, target) {
  const c = CARDS[cardId];
  if (!c.power) return null;
  let base = c.power + (c.perAim ? c.perAim * bram.aim : 0) + 2 * LEVEL;
  if (c.arrow && terrainAt(bram.x, bram.y) === 'bridge') base += 3;
  const halved = !c.pierce && target && (target.guard || shielded(target));
  const m = halved ? 0.5 : 1;
  return { lo: Math.max(1, Math.floor(base * m)), hi: Math.max(1, Math.floor((base + 3) * m)), halved };
}

/* ---------------------------------- starting fights ---------------------------------------- */
function framingFor(points) {
  const k = kFight();
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, feet = (Math.min(...ys) + Math.max(...ys)) / 2;
  const vh = H / k;
  return { x: cx, y: feet + vh * (0.5 - 0.42), k };
}
function placeMossBehind() {
  if (fight && fight.kind === 'arena') { moss.mode = 'place'; moss.tx = 132; moss.ty = 401; return; }
  const dir = bram.face === 'W' ? 1 : -1;
  const cands = [[dir * 18, 4], [dir * 17, -6], [dir * 20, 0], [dir * 14, 10], [dir * 12, -10], [-dir * 2, 13]];
  for (const [dx, dy] of cands) if (walkable(bram.x + dx, bram.y + dy)) { moss.mode = 'place'; moss.tx = bram.x + dx; moss.ty = bram.y + dy; return; }
  moss.mode = 'place'; moss.tx = bram.x + dir * 18; moss.ty = bram.y + 4;
}
function fieldSpots(foe) {
  const here = terrainAt(bram.x, bram.y);
  const found = {};
  for (let dy = -32; dy <= 32; dy += 4) for (let dx = -34; dx <= 34; dx += 4) {
    const x = Math.round(bram.x + dx), y = Math.round(bram.y + dy);
    const dist = Math.hypot(dx, dy);
    if (dist < 13 || dist > 36 || !walkable(x, y)) continue;
    if (Math.hypot(x - foe.x, y - (foe.y + foe.hoverH)) < 22) continue;
    if (!lineClear(bram.x, bram.y, x, y)) continue;
    const t = terrainAt(x, y);
    if (!t || t === here) continue;
    if (!found[t] || dist < found[t].d) found[t] = { x, y, type: t, d: dist };
  }
  return Object.values(found).sort((a, b) => a.d - b.d).slice(0, 2);
}

async function startField(g) {
  mode = 'intro';
  bram.path = []; bram.scripted = false;
  g.state = 'fight';
  const dir = g.x >= bram.x ? 'E' : 'W';
  anim(bram, 'idle', dir, true);
  // anticipate: a "!" over Bramble, the walk has stopped
  pop(bram.x, bram.y - 30, '!', '#3B2A14', 20, { kind: 'bang', ms: 700, rise: 0 });
  await wait(settings.reduced ? 200 : 420);
  // where the Glare hovers: beside Bramble, preferring the stream (its light doubles there)
  let best = null;
  for (const sx of [1, -1]) for (const ddx of [40, 46, 52]) for (let ddy = -14; ddy <= 14; ddy += 4) {
    const gx = bram.x + sx * ddx, gy = bram.y + ddy;
    if (gx < 20 || gx > 300) continue;
    let score = (isWater(gx, gy) ? 3 : 0) + (sx === (dir === 'E' ? 1 : -1) ? 2 : 0) - Math.abs(ddy) / 10 - Math.abs(ddx - 44) / 10;
    if (!best || score > best.score) best = { gx, gy, score };
  }
  const face = best.gx > bram.x ? 'E' : 'W';
  anim(bram, 'idle', face, true);
  fight = { kind: 'field', foes: [g], turn: 1, F: newFighter(), sel: null, spots: [], awaiting: false, target: g,
    place: placeName(), timing: null, mossPips: 3, mossUsed: false, lane: null, log: '' };
  bram.aim = 0; bram.guard = false; g.guard = false; g.intent = null;
  placeMossBehind();
  const fr = framingFor([[bram.x, bram.y], [best.gx, best.gy]]);
  await Promise.all([
    camTo(fr.x, fr.y, fr.k, 520),
    tween(settings.reduced ? 1 : 600, (t) => { g.x = lerp(g.x, best.gx, t); g.y = lerp(g.y, best.gy - g.hoverH, t); }),
  ]);
  g.x = Math.round(best.gx); g.y = Math.round(best.gy - g.hoverH);
  fight.spots = fieldSpots(g);
  g.intent = chooseIntent(g);
  mode = 'fight';
  banner('YOUR MOVE FIRST', 'ITS NEXT MOVE SHOWS ABOVE ITS HEAD.', 'night', 2200);
  runFight();
}
function placeName() {
  if (onBridge(bram.x, bram.y) || Math.hypot(bram.x - 130, bram.y - 298) < 40) return 'WOODLAND PATH, BY THE FOOTBRIDGE';
  if (bram.y < 260) return 'WOODLAND PATH, UNDER THE HOLLOW OAK';
  return 'WOODLAND PATH, BY THE STREAM';
}

async function startArena() {
  mode = 'intro';
  bram.path = [];
  const s = storm; s.state = 'fight';
  pop(bram.x, bram.y - 30, '!', '#3B2A14', 20, { kind: 'bang', ms: 700, rise: 0 });
  const spotDefs = [
    { x: 104, y: 414, type: 'mark' },
    { x: 100, y: 398, type: 'stone' },
    { x: 98, y: 430, type: 'stone' },
  ].map((s) => { const p = nearestOpen(s.x, s.y, 3) || [s.x, s.y]; return { x: p[0], y: p[1], type: s.type }; });
  fight = { kind: 'arena', foes: [s], turn: 1, F: newFighter(), sel: null, spots: [], spotDefs, awaiting: false, target: s,
    place: 'THE STONE RING, WOODLAND', timing: null, mossPips: 3, mossUsed: false, lane: null };
  const fr = { x: RING.cx + 2, y: 0, k: kFight() };
  fr.y = 410 + (H / fr.k) * (0.5 - 0.42);
  const cp = camTo(fr.x, fr.y, fr.k, 650);
  // Bramble walks to the mark, Moss behind him
  bram.scripted = true;
  bram.path = findPath(bram.x, bram.y, spotDefs[0].x, spotDefs[0].y) || [];
  while (bram.path.length) await wait(30);
  bram.scripted = false;
  bram.x = spotDefs[0].x; bram.y = spotDefs[0].y;
  anim(bram, 'idle', 'W', true);
  placeMossBehind();
  await cp;
  bram.aim = 0; bram.guard = false; s.guard = false; s.intent = null; s.cycle = 0; s.phase = 1;
  s.hp = s.max = 100;
  await stormRoar(s);
  s.intent = chooseIntent(s);

  mode = 'fight';
  runFight();
}
function arenaSpots() { return fight.spotDefs.filter((s) => Math.hypot(s.x - bram.x, s.y - bram.y) > 4); }
async function stormRoar(s) {
  banner('THE STATIC STORM', 'A KNOT OF GLARES. IT SPLITS WHEN HALF DIMMED.', 'danger', 2600);
  s.big = true; doShake(4); flashScreen(0.25);
  await wait(500); s.big = false; await wait(200);
}

/* ------------------------------------- the turn loop ----------------------------------------- */
async function runFight() {
  const F = fight.F;
  while (true) {
    // your turn begins: +1 energy (and anything carried), draw to 4, terrain
    F.energy = Math.min(3, F.energy + 1 + F.nextEnergy); F.nextEnergy = 0; F.banked = false;
    drawHand(F);
    if (terrainAt(bram.x, bram.y) === 'bank' && bram.hp < bram.max) { const h = Math.min(4, bram.max - bram.hp); bram.hp += h; pop(bram.x, bram.y - 28, '+' + h, '#7FBF6A', 14); }
    if (!fight.target || fight.target.hp <= 0) fight.target = defaultTarget();
    fight.sel = null; fight.awaiting = true;
    const action = await new Promise((r) => { fight.resolveAction = r; });
    fight.awaiting = false; fight.resolveAction = null;
    if (action.kind === 'leave') return endFight('leave');
    await playerAct(action);
    if (fight.over) return;
    const res = await checkWin();
    if (res === true) return;
    if (res === 'split') { fight.turn++; continue; }
    // Steady: energy left over banks one Aim
    if (F.energy >= 1) bankAim('STEADY');
    await wait(260);
    // the foes' turn: each acts on the intent it showed
    for (const f of fight.foes.slice()) {
      if (f.hp <= 0 || fight.over) continue;
      await foeAct(f);
      if (bram.hp <= 0) return endFight('tired');
      await wait(160);
    }
    for (const f of fight.foes) if (f.hp > 0) f.intent = chooseIntent(f);
    fight.turn++;
    if (fight.turn > 12) return endFight('draw');

}
function defaultTarget() {
  const live = fight.foes.filter((f) => f.hp > 0);
  return live.find((f) => f.kind === 'shard') || live[0];
}
function bankAim(why) {
  const F = fight.F;
  if (F.banked || bram.aim >= 3) return;
  F.banked = true; bram.aim++;
  pop(bram.x - 6, bram.y - 34, '+1 AIM' + (why ? ' ' + why : ''), '#F8DD8F', 10, { kind: 'label', ms: 1100 });
}
function submit(action) { if (fight && fight.awaiting && fight.resolveAction) fight.resolveAction(action); }

async function playerAct(a) {
  const F = fight.F;
  if (a.kind === 'pass') {
    F.energy = Math.min(3, F.energy + 1);
    fx.push({ type: 'breath', x: bram.x, y: bram.y - 10, t0: gt, ms: 700 });
    pop(bram.x + 6, bram.y - 34, '+1 ENERGY', '#A5D77F', 10, { kind: 'label', ms: 1000 });
    await wait(260); bankAim('');
    await wait(500);
    return;
  }
  if (a.kind === 'moss') {
    fight.mossUsed = true;
    const heal = Math.min(8 * fight.mossPips, bram.max - bram.hp);
    moss.hum = gt;
    for (let i = 0; i < 5; i++) fx.push({ type: 'note', x: moss.x + ri(-4, 4), y: moss.y - 14, t0: gt + i * 140, ms: 1100, dx: ri(-6, 6) });
    await wait(500);
    bram.hp += heal; bram.guard = true;
    pop(bram.x, bram.y - 30, '+' + heal, '#7FBF6A', 16);
    fx.push({ type: 'shieldpop', t0: gt, ms: 300 });
    await wait(700);
    return;
  }
  if (a.kind === 'step') {
    const s = a.spot;
    bram.scripted = true; bram.path = [[s.x, s.y]];
    while (bram.path.length) await wait(30);
    bram.scripted = false;
    const tgt = fight.target || fight.foes[0];
    anim(bram, 'idle', tgt.x > bram.x ? 'E' : 'W', true);
    placeMossBehind();
    fight.spots = fight.kind === 'arena' ? arenaSpots() : fieldSpots(fight.foes[0]);
    pop(bram.x, bram.y - 34, TERRAIN[terrainAt(bram.x, bram.y)]?.short || 'STEPPED', '#F3E6C8', 10, { kind: 'label', ms: 1100 });
    await wait(300);
    return;
  }
  // a card
  const id = a.card, c = CARDS[id];
  F.energy -= c.cost;
  F.hand.splice(F.hand.indexOf(id), 1);
  F.discard.push(id);
  const tgt = fight.target && fight.target.hp > 0 ? fight.target : defaultTarget();
  const face = tgt.x > bram.x ? 'E' : 'W';
  if (c.guard) {
    anim(bram, 'cast', face);
    await wait(relFrame('cast', 3));
    bram.guard = true; fx.push({ type: 'shieldpop', t0: gt, ms: 300 });
    bankAim('');
    await wait(500); anim(bram, 'idle', face, true);
    return;
  }
  if (c.arrow) {
    const aimUsed = bram.aim;
    anim(bram, 'attack', face);
    await wait(relFrame('attack', 4));  // anticipate: the draw, held a beat
    const sx = bram.x + (face === 'E' ? 14 : -14), sy = bram.y - 17;
    const nice = await flight({ kind: id === 'longshot' ? 'long' : 'arrow', sx, sy, tx: tgt.x, ty: tgt.y + 2, ms: id === 'longshot' ? 600 : 520, timed: settings.timing !== 'OFF', target: tgt });
    bram.aim = 0;
    await landHit(tgt, id, aimUsed, nice);
    await wait(240); anim(bram, 'idle', face, true);
    return;
  }
  // STRETCH: a cast, a gust of light
  anim(bram, 'cast', face);
  await wait(relFrame('cast', 5));
  await flight({ kind: 'gust', sx: bram.x + (face === 'E' ? 12 : -12), sy: bram.y - 15, tx: tgt.x, ty: tgt.y + 2, ms: 420, timed: false, target: tgt });
  await landHit(tgt, id, 0, false);
  await wait(300); anim(bram, 'idle', face, true);
}

// the shot in flight, with the optional timed tap: a gold ring closes on the target
async function flight(o) {
  const shot = { ...o, p: 0 };
  fx.push({ type: 'shot', shot, t0: gt, ms: 99999 });
  const win = WINDOW[settings.timing] || 0;
  const t0 = nowR(), impact = t0 + o.ms;
  if (o.timed) fight.timing = { open: true, tap: null, impact, win, t0, target: o.target, ms: o.ms };
  while (true) {
    const p = (nowR() - t0) / o.ms;
    shot.p = Math.min(1, p);
    if (p >= 1) break;
    await new Promise((r) => requestAnimationFrame(r));
  }
  shot.done = true;
  fx = fx.filter((e) => e.shot !== shot);
  if (!o.timed) return false;
  // hold the impact (hit pause) while late taps still count
  hitStop = Math.max(hitStop, Math.max(90, win / 2));
  await waitReal(win / 2 + 4);
  const tm = fight.timing; tm.open = false;
  const nice = tm.tap !== null && Math.abs(tm.tap - impact) <= win / 2;
  stats[nice ? 'nice' : tm.tap === null ? 'none' : 'missed']++;
  tm.result = nice ? 'nice' : tm.tap === null ? 'none' : (tm.tap < impact ? 'early' : 'late');
  fight.timing = null;
  return nice;
}
async function landHit(f, id, aimUsed, nice) {
  const c = CARDS[id];
  let base = c.power + (c.perAim ? c.perAim * aimUsed : 0) + 2 * LEVEL + ri(0, 3);
  if (c.arrow && terrainAt(bram.x, bram.y) === 'bridge') base += 3;
  const halved = !c.pierce && (f.guard || shielded(f));
  let n = Math.floor(base * (nice ? 1.25 : 1) * (halved ? 0.5 : 1));
  n = Math.max(1, n);
  if (f.guard && !c.pierce) f.guard = false;
  f.hp = Math.max(f.kind === 'knot' && f.phase === 1 ? 1 : 0, f.hp - n);
  f.squint = gt + 380; f.flash = gt + 70;
  hitStop = Math.max(hitStop, 80);
  doShake(nice ? 5 : 3);
  fx.push({ type: 'spark', x: f.x, y: f.y + 2, t0: gt, ms: 320, big: nice });

    frame(d(ex - 18), d(ey - 18), d(36), d(36), 'night', 0);

      const x = B.x + 16 + i * (ow + 8);
      const on = get() === o;
      const dn = btn('set-' + label + o, x, y, ow, 46, true, () => { set(o); saveSettings(); });
      frame(d(x), d(y), d(ow), d(42), on ? 'gold' : 'paper', 1, dn);
      txt(o, d(x + ow / 2), d(y + 21) + (dn ? U : 0), 10, 'b', BINK, 'center', 'middle');
    });
    y += 60;
  }
  txt(prefersReduced ? 'YOUR PHONE ASKS FOR REDUCED MOTION.' : 'REDUCED MOTION: NO SHAKE, NO CAMERA MOVES, STILL RINGS.', d(B.x + 16), d(y - 6), 8.5, 'm', INK);
  const bw = 160, bx = SW / 2 - bw / 2, by = B.y + B.h - 60;
  const dn = btn('settings-close', bx, by, bw, 50, true, () => (overlay = null));
  frame(d(bx), d(by), d(bw), d(46), 'leaf', 2, dn);
  txt('DONE', d(SW / 2), d(by + 23) + (dn ? 2 * U : 0), 12, 'b', '#FFFDF5', 'center', 'middle');
}

// ---------- main loop --------------------------------------------------------------------------
function frameLoop(t) {
  const dt = Math.min(50, lastReal ? t - lastReal : 16);
  lastReal = t;
  for (let i = realWaiters.length - 1; i >= 0; i--) if (realWaiters[i].t <= nowR()) realWaiters.splice(i, 1)[0].r();
  if (!overlay) step(dt);
  if (!overlay) update(hitStop > 0 ? 0 : dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#1b2a1c'; ctx.fillRect(0, 0, W, H);
  drawWorld();
  drawUI();
  requestAnimationFrame(frameLoop);
}
document.addEventListener('visibilitychange', () => { lastReal = 0; });
window.addEventListener('resize', resize);

// test hooks (for the Playwright run): read-only views and a way to place things
window.NA = {
  get state() { return { mode, overlay, bram: { x: bram.x, y: bram.y, hp: bram.hp, aim: bram.aim, act: bram.act, face: bram.face, guard: bram.guard }, fight: fight && { kind: fight.kind, turn: fight.turn, awaiting: fight.awaiting, energy: fight.F.energy, hand: fight.F.hand.slice(), timingOpen: !!(fight.timing && fight.timing.open), timingIn: fight.timing ? fight.timing.impact - nowR() : null, sel: fight.sel && fight.sel.kind, over: !!fight.over, done: fight.done || null, mossUsed: fight.mossUsed, spots: fight.spots.map((s) => ({ ...s, screen: toScreen(s.x, s.y) })), foes: fight.foes.map((f) => ({ kind: f.kind, hp: f.hp, max: f.max, intent: f.intent && f.intent.name, x: f.x, y: f.y, screen: toScreen(f.x, f.y) })), lane: fight.lane }, foes: foes.map((f) => ({ kind: f.kind, x: f.x, y: f.y, state: f.state, screen: toScreen(f.x, f.y) })), cam: { ...cam }, buttons: buttons.map((b) => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, on: b.on })), banners: banners.map((b) => b.title) }; },
  toScreen, settings, stats,
  teleport(x, y) { bram.x = x; bram.y = y; bram.path = []; trail.length = 0; moss.x = x - 10; moss.y = y; },
  spawnNow() { nextGlareAt = 0; },
  setHp(n) { bram.hp = n; },
  foeHp(n) { if (fight) for (const f of fight.foes) f.hp = Math.min(f.hp, n); },
  glareTo(x, y) { const g = foes.find((f) => f.kind === 'glare'); if (g) { g.x = x; g.y = y; g.alpha = 1; g.route = [[x, y, 60000]]; g.ri = 0; } },
};

(async function boot() {
  resize();
  await loadAll();
  document.getElementById('boot').remove();
  cam.x = bram.x; cam.y = bram.y; cam.k = kWalk(); clampCam();
  trail.push([bram.x, bram.y]);
  anim(bram, 'idle', 'S', true);
  storm = makeStorm(); foes.push(storm);
  if (store.get('seen', false) && Q.get('howto') !== '1') mode = 'walk'; else overlay = 'howto';
  if (mode === 'boot') mode = 'walk';
  requestAnimationFrame(frameLoop);
})();
</script>
