/* ============================================================================================
   NapAttack prototype: in-world, turn-based fights (MOCK). One file, canvas, touch first.
   World art is drawn at 1 art px on an offscreen canvas, then scaled by a whole number of
   device px (k) so the pixel grid never blurs. Interface is drawn in device px on top.
   ============================================================================================ */

// ---------- settings (per viewer, in browser storage, safe if storage is missing) -------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('napattack-turns:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('napattack-turns:' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const prefersReduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const Q = new URLSearchParams(location.search);
const settings = {
  timing: store.get('timing', 'TAP'),            // TAP (160 ms), RELAXED (320 ms), OFF
  shake: store.get('shake', !prefersReduced),
  reduced: store.get('reduced', prefersReduced),
};
if (Q.get('reduced') === '1') settings.reduced = true;
const saveSettings = () => { store.set('timing', settings.timing); store.set('shake', settings.shake); store.set('reduced', settings.reduced); };
const WINDOW = { TAP: 160, RELAXED: 320, OFF: 0 };

// ---------- random (seedable for tests) -----------------------------------------------------
let seed = Number(Q.get('seed')) || (Date.now() % 100000) + 1;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));

// ---------- canvas and layout --------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const art = document.createElement('canvas');
const actx = art.getContext('2d');
let dpr = 1, SW = 402, SH = 874, W = 402, H = 874;
let safe = { t: 0, r: 0, b: 0, l: 0 };
let U = 1;  // device px per frame unit (1.33 css px)
function resize() {
  dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  SW = window.innerWidth; SH = window.innerHeight;
  W = Math.round(SW * dpr); H = Math.round(SH * dpr);
  cv.width = W; cv.height = H; cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  const cs = getComputedStyle(document.getElementById('safe'));
  safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  U = Math.max(1, Math.round(dpr * 4 / 3));
  if (cam && !camAnim) cam.k = mode === 'walk' ? kWalk() : kFight();
}
const d = (v) => Math.round(v * dpr);           // css px -> device px
const kWalk = () => Math.max(1, Math.ceil(H / 576), Math.ceil(W / 320));
const kFight = () => Math.max(kWalk() + 1, Math.floor(W / 120));

// ---------- images ---------------------------------------------------------------------------
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
const IMG = {};
async function loadAll() {
  const jobs = [['ground', A.ground], ['flow', A.flow], ['bramble', A.bramble.img], ['moss', A.moss.img],

const TREE_KINDS = new Set(['oak', 'beech', 'birch', 'pine', 'willow', 'hollow_tree']);
function terrainAt(x, y) {
  if (fight && fight.kind === 'arena') { const s = fight.spotDefs.find((s) => Math.hypot(s.x - x, s.y - y) < 4); return s ? s.type : 'mark'; }
  if (onBridge(x, y)) return 'bridge';
  for (const o of A.objects) {
    if (!TREE_KINDS.has(o[1])) continue;
    const tx = o[2] + o[4] / 2, foot = o[3] + o[5];
    if (Math.abs(x - tx) < 14 && y > foot - 10 && y < foot + 12) return 'shade';
  }
  for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4; if (isWater(x + Math.cos(ang) * 7, y + Math.sin(ang) * 6)) return 'bank'; }
  return null;
}

function newFighter() {
  return { hand: [], draw: shuffle(DECK), discard: [], energy: 1, nextEnergy: 0, banked: false };
}

// --------- foe intents --------------------------------------------------------------------
function glareIntent(f) {
  const r = rand();
  if (!f.intent) return { type: 'hit', n: 7, name: 'DAZZLE', icon: 'sun' };
  if (f.intent.type !== 'guard' && r < 0.2) return { type: 'guard', name: 'FLICKER', icon: 'cover', note: 'HALVES YOUR NEXT HIT' };
  if (f.hp < f.max * 0.6 && !f.healed && r < 0.45) { f.healed = true; return { type: 'heal', n: 6, name: 'GLOW UP', icon: 'sun', note: '+6 BRIGHTNESS' }; }
  return { type: 'hit', n: 7, name: 'DAZZLE', icon: 'sun' };
}
function stormIntent(f) {
  if (f.kind === 'knot') {
    const cyc = ['crackle', 'gather', 'sweep', 'shield'][f.cycle++ % 4];
    if (cyc === 'crackle') return { type: 'hit', n: 6, name: 'CRACKLE', icon: 'sun' };
    if (cyc === 'shield') return { type: 'guard', name: 'STATIC SHIELD', icon: 'cover', note: 'HALVES YOUR NEXT HIT' };
    if (cyc === 'gather') return { type: 'gather', name: 'GATHER', icon: 'energy', note: 'A SWEEP COMES NEXT' };
    return { type: 'sweep', n: 18, name: 'STORM SWEEP', icon: 'energy', big: true, note: 'STEP OUT OF THE LANE OR TAKE COVER' };
  }
  if (f.kind === 'core') {
    const cyc = ['charge', 'charge', 'overload', 'crackle'][f.cycle++ % 4];
    if (cyc === 'charge') { const left = f.cycle % 4 === 1 ? 2 : 1; return { type: 'charge', name: 'CHARGING', icon: 'energy', count: left, note: `OVERLOAD IN ${left + 1}`, big: true }; }
    if (cyc === 'overload') return { type: 'hit', n: 20, name: 'OVERLOAD', icon: 'energy', big: true, note: 'TAKE COVER OR LET MOSS HUM' };
    return { type: 'hit', n: 6, name: 'CRACKLE', icon: 'sun' };
  }
  return { type: 'hit', n: 4, name: 'ZAP', icon: 'sun' };  // a shard
}
const chooseIntent = (f) => (f.kind === 'glare' ? glareIntent(f) : stormIntent(f));
function shielded(f) { return f.kind === 'core' && fight && fight.foes.some((s) => s.kind === 'shard' && s.hp > 0); }
function incoming(f, it) {
  if (!it || (it.type !== 'hit' && it.type !== 'sweep')) return null;
  let n = it.n;
  if (f.kind === 'glare' && isWater(f.x, f.y + f.hoverH)) n += 2;
  const ter = terrainAt(bram.x, bram.y);
  if (ter === 'shade' || ter === 'stone') n -= 3;
  return Math.max(1, n);
}

function hitRange(cardId, target) {
  const c = CARDS[cardId];
  if (!c.power) return null;
  let base = c.power + (c.perAim ? c.perAim * bram.aim : 0) + 2 * LEVEL;
  if (c.arrow && terrainAt(bram.x, bram.y) === 'bridge') base += 3;
  const halved = !c.pierce && target && (target.guard || shielded(target));
  const m = halved ? 0.5 : 1;
  return { lo: Math.max(1, Math.floor(base * m)), hi: Math.max(1, Math.floor((base + 3) * m)), halved };
}

/* ---------------------------------- starting fights ---------------------------------------- */
function framingFor(points) {
  const k = kFight();
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, feet = (Math.min(...ys) + Math.max(...ys)) / 2;
  const vh = H / k;
  return { x: cx, y: feet + vh * (0.5 - 0.42), k };
}
function placeMossBehind() {
  if (fight && fight.kind === 'arena') { moss.mode = 'place'; moss.tx = 132; moss.ty = 401; return; }
  const dir = bram.face === 'W' ? 1 : -1;
  const cands = [[dir * 18, 4], [dir * 17, -6], [dir * 20, 0], [dir * 14, 10], [dir * 12, -10], [-dir * 2, 13]];
  for (const [dx, dy] of cands) if (walkable(bram.x + dx, bram.y + dy)) { moss.mode = 'place'; moss.tx = bram.x + dx; moss.ty = bram.y + dy; return; }
  moss.mode = 'place'; moss.tx = bram.x + dir * 18; moss.ty = bram.y + 4;
}
function fieldSpots(foe) {
  const here = terrainAt(bram.x, bram.y);
  const found = {};
  for (let dy = -32; dy <= 32; dy += 4) for (let dx = -34; dx <= 34; dx += 4) {
    const x = Math.round(bram.x + dx), y = Math.round(bram.y + dy);
    const dist = Math.hypot(dx, dy);
    if (dist < 13 || dist > 36 || !walkable(x, y)) continue;
    if (Math.hypot(x - foe.x, y - (foe.y + foe.hoverH)) < 22) continue;
    if (!lineClear(bram.x, bram.y, x, y)) continue;
    const t = terrainAt(x, y);
    if (!t || t === here) continue;
    if (!found[t] || dist < found[t].d) found[t] = { x, y, type: t, d: dist };
  }
  return Object.values(found).sort((a, b) => a.d - b.d).slice(0, 2);
}

async function startField(g) {
  mode = 'intro';
  bram.path = []; bram.scripted = false;
  g.state = 'fight';
  const dir = g.x >= bram.x ? 'E' : 'W';
  anim(bram, 'idle', dir, true);
  // anticipate: a "!" over Bramble, the walk has stopped
  pop(bram.x, bram.y - 30, '!', '#3B2A14', 20, { kind: 'bang', ms: 700, rise: 0 });
  await wait(settings.reduced ? 200 : 420);
  // where the Glare hovers: beside Bramble, preferring the stream (its light doubles there)
  let best = null;
  for (const sx of [1, -1]) for (const ddx of [40, 46, 52]) for (let ddy = -14; ddy <= 14; ddy += 4) {
    const gx = bram.x + sx * ddx, gy = bram.y + ddy;
    if (gx < 20 || gx > 300) continue;
    let score = (isWater(gx, gy) ? 3 : 0) + (sx === (dir === 'E' ? 1 : -1) ? 2 : 0) - Math.abs(ddy) / 10 - Math.abs(ddx - 44) / 10;
    if (!best || score > best.score) best = { gx, gy, score };
  }
  const face = best.gx > bram.x ? 'E' : 'W';

    place: placeName(), timing: null, mossPips: 3, mossUsed: false, lane: null, log: '' };
  bram.aim = 0; bram.guard = false; g.guard = false; g.intent = null;
  placeMossBehind();

  await Promise.all([
    camTo(fr.x, fr.y, fr.k, 520),
    tween(settings.reduced ? 1 : 600, (t) => { g.x = lerp(g.x, best.gx, t); g.y = lerp(g.y, best.gy - g.hoverH, t); }),
  ]);
  g.x = Math.round(best.gx); g.y = Math.round(best.gy - g.hoverH);
  fight.spots = fieldSpots(g);

function placeName() {

function arenaSpots() { return fight.spotDefs.filter((s) => Math.hypot(s.x - bram.x, s.y - bram.y) > 4); }
async function stormRoar(s) {

/* ------------------------------------- the turn loop ----------------------------------------- */
async function runFight() {
  const F = fight.F;
  while (true) {
    // your turn begins: +1 energy (and anything carried), draw to 4, terrain
    F.energy = Math.min(3, F.energy + 1 + F.nextEnergy); F.nextEnergy = 0; F.banked = false;
    drawHand(F);
    if (terrainAt(bram.x, bram.y) === 'bank' && bram.hp < bram.max) { const h = Math.min(4, bram.max - bram.hp); bram.hp += h; pop(bram.x, bram.y - 28, '+' + h, '#7FBF6A', 14); }
    if (!fight.target || fight.target.hp <= 0) fight.target = defaultTarget();
    fight.sel = null; fight.awaiting = true;
    const action = await new Promise((r) => { fight.resolveAction = r; });
    fight.awaiting = false; fight.resolveAction = null;
    if (action.kind === 'leave') return endFight('leave');
    await playerAct(action);
    if (fight.over) return;
    const res = await checkWin();
    if (res === true) return;
    if (res === 'split') { fight.turn++; continue; }
    // Steady: energy left over banks one Aim
    if (F.energy >= 1) bankAim('STEADY');
    await wait(260);
    // the foes' turn: each acts on the intent it showed
    for (const f of fight.foes.slice()) {
      if (f.hp <= 0 || fight.over) continue;
      await foeAct(f);
      if (bram.hp <= 0) return endFight('tired');
      await wait(160);
    }
    for (const f of fight.foes) if (f.hp > 0) f.intent = chooseIntent(f);
    fight.turn++;
    if (fight.turn > 12) return endFight('draw');
  }
}
function defaultTarget() {

  return live.find((f) => f.kind === 'shard') || live[0];
}
function bankAim(why) {
  const F = fight.F;
  if (F.banked || bram.aim >= 3) return;
  F.banked = true; bram.aim++;
  pop(bram.x - 6, bram.y - 34, '+1 AIM' + (why ? ' ' + why : ''), '#F8DD8F', 10, { kind: 'label', ms: 1100 });
}
function submit(action) { if (fight && fight.awaiting && fight.resolveAction) fight.resolveAction(action); }

async function playerAct(a) {
  const F = fight.F;
  if (a.kind === 'pass') {
    F.energy = Math.min(3, F.energy + 1);
    fx.push({ type: 'breath', x: bram.x, y: bram.y - 10, t0: gt, ms: 700 });
    pop(bram.x + 6, bram.y - 34, '+1 ENERGY', '#A5D77F', 10, { kind: 'label', ms: 1000 });
    await wait(260); bankAim('');
    await wait(500);
    return;
  }
  if (a.kind === 'moss') {
    fight.mossUsed = true;
    const heal = Math.min(8 * fight.mossPips, bram.max - bram.hp);
    moss.hum = gt;
    for (let i = 0; i < 5; i++) fx.push({ type: 'note', x: moss.x + ri(-4, 4), y: moss.y - 14, t0: gt + i * 140, ms: 1100, dx: ri(-6, 6) });
    await wait(500);
    bram.hp += heal; bram.guard = true;
    pop(bram.x, bram.y - 30, '+' + heal, '#7FBF6A', 16);
    fx.push({ type: 'shieldpop', t0: gt, ms: 300 });
    await wait(700);
    return;
  }
  if (a.kind === 'step') {
    const s = a.spot;
    bram.scripted = true; bram.path = [[s.x, s.y]];
    while (bram.path.length) await wait(30);
    bram.scripted = false;
    const tgt = fight.target || fight.foes[0];
    anim(bram, 'idle', tgt.x > bram.x ? 'E' : 'W', true);
    placeMossBehind();
    fight.spots = fight.kind === 'arena' ? arenaSpots() : fieldSpots(fight.foes[0]);
    pop(bram.x, bram.y - 34, TERRAIN[terrainAt(bram.x, bram.y)]?.short || 'STEPPED', '#F3E6C8', 10, { kind: 'label', ms: 1100 });
    await wait(300);
    return;
  }

  const id = a.card, c = CARDS[id];
  F.energy -= c.cost;

  F.discard.push(id);
  const tgt = fight.target && fight.target.hp > 0 ? fight.target : defaultTarget();
  const face = tgt.x > bram.x ? 'E' : 'W';
  if (c.guard) {
    anim(bram, 'cast', face);

    bram.guard = true; fx.push({ type: 'shieldpop', t0: gt, ms: 300 });

  }

    const aimUsed = bram.aim;
    anim(bram, 'attack', face);
    await wait(relFrame('attack', 4));  // anticipate: the draw, held a beat
    const sx = bram.x + (face === 'E' ? 14 : -14), sy = bram.y - 17;
    const nice = await flight({ kind: id === 'longshot' ? 'long' : 'arrow', sx, sy, tx: tgt.x, ty: tgt.y + 2, ms: id === 'longshot' ? 600 : 520, timed: settings.timing !== 'OFF', target: tgt });
    bram.aim = 0;
    await landHit(tgt, id, aimUsed, nice);
    await wait(240); anim(bram, 'idle', face, true);
    return;
  }
  // STRETCH: a cast, a gust of light
  anim(bram, 'cast', face);
  await wait(relFrame('cast', 5));
  await flight({ kind: 'gust', sx: bram.x + (face === 'E' ? 12 : -12), sy: bram.y - 15, tx: tgt.x, ty: tgt.y + 2, ms: 420, timed: false, target: tgt });
  await landHit(tgt, id, 0, false);
  await wait(300); anim(bram, 'idle', face, true);
}

// the shot in flight, with the optional timed tap: a gold ring closes on the target
async function flight(o) {
  const shot = { ...o, p: 0 };
  fx.push({ type: 'shot', shot, t0: gt, ms: 99999 });
  const win = WINDOW[settings.timing] || 0;
  const t0 = nowR(), impact = t0 + o.ms;
  if (o.timed) fight.timing = { open: true, tap: null, impact, win, t0, target: o.target, ms: o.ms };
  while (true) {
    const p = (nowR() - t0) / o.ms;
    shot.p = Math.min(1, p);
    if (p >= 1) break;
    await new Promise((r) => requestAnimationFrame(r));
  }
  shot.done = true;
  fx = fx.filter((e) => e.shot !== shot);
  if (!o.timed) return false;
  // hold the impact (hit pause) while late taps still count
  hitStop = Math.max(hitStop, Math.max(90, win / 2));
  await waitReal(win / 2 + 4);
  const tm = fight.timing; tm.open = false;
  const nice = tm.tap !== null && Math.abs(tm.tap - impact) <= win / 2;
  stats[nice ? 'nice' : tm.tap === null ? 'none' : 'missed']++;
  tm.result = nice ? 'nice' : tm.tap === null ? 'none' : (tm.tap < impact ? 'early' : 'late');
  fight.timing = null;
  return nice;
}
async function landHit(f, id, aimUsed, nice) {
  const c = CARDS[id];
  let base = c.power + (c.perAim ? c.perAim * aimUsed : 0) + 2 * LEVEL + ri(0, 3);
  if (c.arrow && terrainAt(bram.x, bram.y) === 'bridge') base += 3;
  const halved = !c.pierce && (f.guard || shielded(f));
  let n = Math.floor(base * (nice ? 1.25 : 1) * (halved ? 0.5 : 1));
  n = Math.max(1, n);
  if (f.guard && !c.pierce) f.guard = false;
  f.hp = Math.max(f.kind === 'knot' && f.phase === 1 ? 1 : 0, f.hp - n);
  f.squint = gt + 380; f.flash = gt + 70;
  hitStop = Math.max(hitStop, 80);
  doShake(nice ? 5 : 3);
  fx.push({ type: 'spark', x: f.x, y: f.y + 2, t0: gt, ms: 320, big: nice });
  tween(220, (t) => { f.dx = (bram.x < f.x ? 1 : -1) * Math.round(3 * (1 - t)); }, easeOut);
  pop(f.x, f.y - 10, String(n), nice ? '#F8DD8F' : '#FFFDF5', nice ? 22 : 18);
  if (nice) { pop(f.x, f.y - 26, 'NICE', '#F8DD8F', 13, { kind: 'stamp', ms: 900 }); moss.hop = gt; }
  if (halved) pop(f.x + 2, f.y + 14, f.kind === 'core' ? 'SHARDS SHIELD IT' : 'HALVED', '#C9B8FF', 9, { kind: 'label', ms: 1000, rise: 6 });
  if (c.pierce && (f.guard || shielded(f))) pop(f.x, f.y + 14, 'PIERCED', '#F8DD8F', 9, { kind: 'label', ms: 1000, rise: 6 });
  if (!nice && fight.lastTiming) { /* reserved */ }
  await wait(120);
}

async function checkWin() {
  // the storm splits when half dimmed
  for (const f of fight.foes) {
    if (f.kind === 'knot' && f.phase === 1 && f.hp <= f.max / 2 && f.hp > 0) { await splitStorm(f); return 'split'; }
  }
  for (const f of fight.foes.slice()) if (f.hp <= 0 && !f.calm) await calmFoe(f);
  const core = fight.foes.find((f) => f.kind === 'core' || f.kind === 'knot' || f.kind === 'glare');
  if (core && core.hp <= 0) {
    for (const f of fight.foes) if (f.hp > 0) { f.hp = 0; await calmFoe(f, true); }
    await endFight('win');
    return true;
  }
  return false;
}
async function calmFoe(f, quick) {
  f.calm = true; f.intent = null; f.guard = false;
  f.flash = gt + 120;
  pop(f.x, f.y - 26, 'CALMED', '#FFD27A', 12, { kind: 'stamp', ms: 1000 });
  await wait(quick ? 200 : 650);
  // it folds into a spark and drifts home
  f.fold = gt;
  fx.push({ type: 'fold', x: f.x, y: f.y, t0: gt, ms: 1200 });
  await wait(quick ? 150 : 350);
  f.state = 'folded';
}
async function splitStorm(k) {
  k.phase = 2; k.intent = null; fight.lane = null;
  banner('IT SPLITS!', 'TWO SHARDS SHIELD THE CORE. CALM THEM, OR PIERCE WITH A LONG SHOT.', 'danger', 3000);
  // anticipate: a shudder, then act: it bursts apart

  k.dx = 0; k.big = true; await wait(220);
  flashScreen(0.45); doShake(6); hitStop = 100;
  const core = { kind: 'core', name: 'CORE', x: k.x, y: k.y + 4, hp: 36, max: 36, state: 'fight', alpha: 1, dx: 0, dy: 0, big: false, squint: 0, flash: gt + 90,
    guard: false, intent: null, calm: false, fold: 0, hoverH: 14, cycle: 0, motes: [] };
  const sA = { kind: 'shard', name: 'SHARD', x: k.x, y: k.y, hp: 14, max: 14, state: 'fight', alpha: 1, dx: 0, dy: 0, big: false, squint: 0, flash: 0, guard: false, intent: null, calm: false, fold: 0, hoverH: 13, motes: [] };
  const sB = { ...sA, motes: [] };
  foes = foes.filter((f) => f !== k);
  if (storm === k) storm = null;
  foes.push(core, sA, sB);
  fight.foes = [core, sA, sB];
  fight.target = sA;
  for (let i = 0; i < 6; i++) fx.push({ type: 'spark', x: k.x + ri(-12, 12), y: k.y + ri(-10, 10), t0: gt + i * 50, ms: 300 });
  // settle: the shards swing out on an arc to their places
  const A0 = [k.x, k.y], pa = [78, 386], pb = [76, 418], pc = [58, 402];
  await tween(settings.reduced ? 1 : 520, (t) => {
    sA.x = lerp(A0[0], pa[0], t); sA.y = lerp(A0[1], pa[1], t) - Math.sin(t * Math.PI) * 8;
    sB.x = lerp(A0[0], pb[0], t); sB.y = lerp(A0[1], pb[1], t) + Math.sin(t * Math.PI) * 4;
    core.x = lerp(A0[0], pc[0], t); core.y = lerp(A0[1] + 4, pc[1], t);
  }, easeOut);
  for (const f of [core, sA, sB]) { f.x = Math.round(f.x); f.y = Math.round(f.y); }
  core.intent = chooseIntent(core); sA.intent = chooseIntent(sA); sB.intent = chooseIntent(sB);
  storm = null;
  await wait(300);
}

async function foeAct(f) {
  const it = f.intent; if (!it) return;
  const toward = bram.x > f.x ? 1 : -1;

function controlsLayout() {
  const by = SH - safe.b - 12;
  const hub = { x: SW - safe.r - 12 - 86, y: by - 86, w: 86, h: 86 };
  const hx = hub.x + hub.w / 2, hy = hub.y + hub.h / 2;
  const r = Math.min(128, Math.max(108, (SW - 32) * 0.34));
  const slots = [180, 210, 240, 270].map((a) => {
    const t = a * Math.PI / 180;
    return { cx: hx + r * Math.cos(t), cy: hy + r * Math.sin(t) };
  });
  const colX = 12 + safe.l, colW = Math.min(176, slots[0].cx - 29 - 8 - colX);
  return { by, hub, slots, colX, colW, size: 58 };
}

function drawFightUi() {
  const F = fight.F;
  const off = 1 - easeOut(ui.fight);
  // header: what happened, where, the turn, TIMING, LEAVE
  const hy = safe.t + 8 - off * 90, hx = 8 + safe.l, hw = SW - 16 - safe.l - safe.r;
  frame(d(hx), d(hy), d(hw), d(54), 'paper', 1);
  const htitle = fight.kind === 'arena' ? 'THE STATIC STORM' : 'A GLARE DRIFTED IN';
  txt(htitle, d(hx + 12), d(hy + 10), 9.5, 'd', BINK);
  const ter = terrainAt(bram.x, bram.y);
  const sub = `${fight.place.split(',')[0]} · TURN ${Math.min(fight.turn, 12)} OF 12`;
  txt(sub, d(hx + 12), d(hy + 30), 10, 'm', INK);
  const can = fight.awaiting;
  const ld = btn('leave', hx + hw - 50, hy + 3, 46, 48, can, () => submit({ kind: 'leave' }));
  frame(d(hx + hw - 50), d(hy + 5), d(44), d(42), can ? 'paper' : 'disabled', 1, ld);
  icon('close', d(hx + hw - 28) - 8 * iconScale(20), d(hy + 26) - 8 * iconScale(20) + (ld ? U : 0), iconScale(20));
  const tdn = btn('timing', hx + hw - 128, hy + 3, 74, 48, true, cycleTiming);
  frame(d(hx + hw - 126), d(hy + 5), d(70), d(42), settings.timing === 'OFF' ? 'disabled' : 'gold', 1, tdn);
  txt('TIMING', d(hx + hw - 91), d(hy + 16) + (tdn ? U : 0), 8, 'b', BINK, 'center', 'middle');
  txt(settings.timing, d(hx + hw - 91), d(hy + 33) + (tdn ? U : 0), 10, 'b', BINK, 'center', 'middle');
  // terrain chip under the header
  if (ter && ter !== 'mark') {
    const label = 'BRAMBLE: ' + TERRAIN[ter].name + ' · ' + TERRAIN[ter].line.split(': ')[1];
    const tw = Math.min(hw, txtW(label, 9, 'b') / dpr + 16);
    frame(d(hx), d(hy + 60), d(tw), d(20), 'leaf', 0);
    txt(label, d(hx + 8), d(hy + 70), 9, 'b', '#FFFDF5', 'left', 'middle');
  }
  const foeOnWater = fight.foes.find((f) => f.kind === 'glare' && f.hp > 0 && isWater(f.x, f.y + f.hoverH));
  if (foeOnWater) {
    const label = 'GLARE OVER THE STREAM · ITS LIGHT DOUBLES: DAZZLE +2';
    const tw = Math.min(hw, txtW(label, 9, 'b') / dpr + 16);
    frame(d(hx), d(hy + (ter ? 84 : 60)), d(tw), d(20), 'night', 0);
    txt(label, d(hx + 8), d(hy + (ter ? 94 : 70)), 9, 'b', '#DDF5FF', 'left', 'middle');
  }

  // the bottom: the command ring, the hub, the left column
  const L = controlsLayout();
  const dropY = off * 260;
  ctx.save(); ctx.translate(0, d(dropY));
  const myTurn = fight.awaiting;
  // ring track
  const hcx = L.hub.x + L.hub.w / 2, hcy = L.hub.y + L.hub.h / 2;
  ctx.strokeStyle = 'rgba(30,25,23,0.35)'; ctx.lineWidth = d(10); ctx.beginPath();
  ctx.arc(d(hcx), d(hcy), d(Math.hypot(L.slots[0].cx - hcx, L.slots[0].cy - hcy)), Math.PI * 0.97, Math.PI * 1.53); ctx.stroke();
  const badges = [];
  for (let i = 0; i < 4; i++) {
    const id = F.hand[i];
    const s = L.slots[i];
    const x = s.cx - L.size / 2, y = s.cy - L.size / 2;
    if (!id) { ctx.globalAlpha = 0.35; frame(d(x + 6), d(y + 6), d(L.size - 12), d(L.size - 12), 'inset', 0); ctx.globalAlpha = 1; continue; }
    const c = CARDS[id];
    const afford = F.energy >= c.cost;
    const sel = fight.sel && fight.sel.kind === 'card' && fight.sel.idx === i;
    const on = myTurn && afford;
    const dn = btn('slot-' + i, x - 2, y - 2, L.size + 4, L.size + 4, myTurn, () => { fight.sel = { kind: 'card', idx: i, card: id }; });
    const lift = sel ? -6 : 0;
    frame(d(x), d(y + lift), d(L.size), d(L.size), !on ? 'disabled' : sel ? 'leaf' : 'paper', 1, dn);
    const s2 = iconScale(26);
    icon(c.icon, d(x + L.size / 2) - 8 * s2, d(y + lift + 7) + (dn ? U : 0), s2);
    txt(c.name, d(x + L.size / 2), d(y + lift + L.size - 13) + (dn ? U : 0), c.name.length > 7 ? 7.5 : 8.5, 'b', sel ? '#FFFDF5' : BINK, 'center', 'middle');
    badges.push([x - 6, y + lift - 8, afford, c.cost]);
  }
  // cost badges on top of every slot
  for (const [bx, by2, afford, cost] of badges) {
    frame(d(bx), d(by2), d(22), d(20), afford ? 'gold' : 'danger', 0);
    txt(String(cost), d(bx + 11), d(by2 + 11), 8, 'd', BINK, 'center', 'middle');
  }
  // the hub: the chosen thing, TAP TO PLAY (never moves)
  const sel = fight.sel;
  let hubTone = 'parchment', hubTitle = 'BE STILL', hubSub = '+1 ENERGY +1 AIM', hubIcon = 'moon', playable = myTurn, action = { kind: 'pass' };
  if (sel && sel.kind === 'card') {
    const c = CARDS[sel.card];
    const ok = F.energy >= c.cost;
    hubTone = ok ? 'leaf' : 'disabled'; hubTitle = c.name; hubSub = ok ? 'TAP TO PLAY' : 'NEEDS ' + c.cost + ' ENERGY'; hubIcon = c.icon; playable = myTurn && ok; action = { kind: 'card', card: sel.card };
  } else if (sel && sel.kind === 'step') {
    hubTone = 'gold'; hubTitle = 'STEP'; hubSub = 'TO ' + TERRAIN[sel.spot.type].short; hubIcon = 'sprout'; action = { kind: 'step', spot: sel.spot };
  } else if (sel && sel.kind === 'moss') {
    hubTone = 'nap'; hubTitle = 'MOSS HUMS'; hubSub = 'TAP TO PLAY'; hubIcon = 'moon'; action = { kind: 'moss' };
  }
  if (!myTurn) { hubTone = 'disabled'; hubTitle = mode === 'fight' ? 'ITS TURN' : '...'; hubSub = ''; hubIcon = null; playable = false; }
  const hdn = btn('hub', L.hub.x, L.hub.y, L.hub.w, L.hub.h, playable, () => { const a = action; fight.sel = null; submit(a); });
  frame(d(L.hub.x), d(L.hub.y), d(L.hub.w), d(L.hub.h), hubTone, 2, hdn);
  const hp = hdn ? 2 * U : 0;
  const light = hubTone === 'leaf' || hubTone === 'nap';
  if (hubIcon) icon(hubIcon, d(hcx) - 8 * iconScale(28), d(L.hub.y + 8) + hp, iconScale(28));
  txt(hubTitle, d(hcx), d(L.hub.y + 50) + hp, hubTitle.length > 9 ? 9 : 11, 'b', light ? '#FFFDF5' : BINK, 'center', 'middle');
  if (hubSub) txt(hubSub, d(hcx), d(L.hub.y + 67) + hp, 7.5, 'b', light ? '#E9F5DF' : INK, 'center', 'middle');

  // left column: what the chosen thing does, energy; BE STILL; MOSS HUMS
  const cx = L.colX, cw = L.colW;
  const mossY = L.by - 50, stillY = mossY - 56, wellY = stillY - 108;
  frame(d(cx), d(wellY), d(cw), d(100), 'inset', 0);
  let title = myTurn ? 'YOUR TURN' : 'ITS TURN', lines = [];
  if (myTurn && !sel) lines = ['CHOOSE A CARD ON THE RING, OR BE STILL.', fight.foes.filter((f) => f.hp > 0).length > 1 ? 'TAP A FOE TO AIM AT IT.' : (fight.spots.length ? 'OR TAP A MARKED SPOT TO STEP.' : '')];
  if (sel && sel.kind === 'card') {
    const c = CARDS[sel.card]; title = c.name;
    const rg = hitRange(sel.card, fight.target);
    lines = [c.line];
    if (rg) lines.push(`HITS ${rg.lo}-${rg.hi}${c.perAim && bram.aim ? ' (AIM ' + bram.aim + ')' : ''}${rg.halved ? ', HALVED' : ''}`);
    if (c.guard) lines = ['GUARD: HALVES THE NEXT HIT.', '+1 AIM. COSTS 1.'];
  }
  if (sel && sel.kind === 'step') { const t = TERRAIN[sel.spot.type]; title = 'STEP: ' + t.short; lines = [t.line, 'USES YOUR TURN.']; }
  if (sel && sel.kind === 'moss') { title = 'MOSS HUMS'; lines = [`HEAL ${8 * fight.mossPips} AND GUARD.`, 'ONCE A FIGHT, FROM REST.']; }
  if (!myTurn) lines = ['WATCH ITS MOVE.', fight.timing ? 'TAP AS THE RING CLOSES!' : ''];
  if (fight.timing && fight.timing.open) { title = 'TAP NOW!'; lines = ['TAP ANYWHERE AS THE GOLD', 'RING MEETS THE WHITE.']; }
  txt(title, d(cx + 8), d(wellY + 9), 10, 'b', BINK);
  let ly = wellY + 27;
  for (const l of lines) { if (!l) continue; for (const w of wrapLines(l, d(cw - 16), 8.5, 'm')) { txt(w, d(cx + 8), d(ly), 8.5, 'm', INK); ly += 12; } }
  txt('ENERGY', d(cx + 8), d(wellY + 82), 9, 'b', BINK, 'left', 'middle');
  pips(d(cx + 58), d(wellY + 76), F.energy, 3, 12);
  // BE STILL
  const sdn = btn('still', cx, stillY, cw, 50, myTurn, () => { fight.sel = null; submit({ kind: 'pass' }); });
  frame(d(cx), d(stillY), d(cw), d(46), 'paper', 1, sdn);
  const sp = sdn ? U : 0;
  txt('BE STILL', d(cx + cw / 2), d(stillY + 15) + sp, 11, 'b', BINK, 'center', 'middle');
  txt('+1 ENERGY · +1 AIM', d(cx + cw / 2), d(stillY + 32) + sp, 8.5, 'm', INK, 'center', 'middle');
  // MOSS HUMS (the familiar's rested special)
  const mOn = myTurn && !fight.mossUsed;
  const mdn = btn('moss', cx, mossY, cw, 46, mOn, () => (fight.sel = { kind: 'moss' }));
  frame(d(cx), d(mossY), d(cw), d(42), fight.mossUsed ? 'disabled' : 'nap', 1, mdn);
  const mp = mdn ? U : 0;
  icon('moon', d(cx + 6), d(mossY + 5) + mp, iconScale(16));
  txt(fight.mossUsed ? 'MOSS IS RESTING' : 'MOSS HUMS', d(cx + 28), d(mossY + 13) + mp, 10, 'b', fight.mossUsed ? INK : '#FFFDF5', 'left', 'middle');
  txt(fight.mossUsed ? 'USED THIS FIGHT' : 'RESTED', d(cx + 28), d(mossY + 29) + mp, 8, 'm', fight.mossUsed ? INK : '#E8E0FF', 'left', 'middle');
  if (!fight.mossUsed) pips(d(cx + cw - 50), d(mossY + 23) + mp, fight.mossPips, 3, 11, '#F8DD8F', '#4C3F80');
  ctx.restore();
}
function cycleTiming() {
  settings.timing = settings.timing === 'TAP' ? 'RELAXED' : settings.timing === 'RELAXED' ? 'OFF' : 'TAP';
  saveSettings();
  banner('TIMING: ' + settings.timing, settings.timing === 'OFF' ? 'NO TAP. EVERY SHOT IS A PLAIN HIT.' : `TAP AS THE RING CLOSES FOR +25%. WINDOW ${WINDOW[settings.timing]} MS.`, 'parchment', 1800);
}
function drawWalkOn() {
  const w = 180, h = 54, x = SW / 2 - w / 2, y = SH - safe.b - 120;
  const dn = btn('walkon', x, y, w, h, true, () => { const r = fight.resolveWalkOn; fight.done = null; r && r(); });
  frame(d(x), d(y), d(w), d(h), 'leaf', 2, dn);
  txt('WALK ON', d(SW / 2), d(y + h / 2) + (dn ? 2 * U : 0), 13, 'b', '#FFFDF5', 'center', 'middle');
}

function drawPops() {
  for (const p of pops) {
    const t = (gt - p.t0) / p.ms;
    if (t >= 1) continue;
    const [sx, sy] = toScreen(p.x, p.y);
    // anticipate (small), act (overshoot), settle (rest and rise)
    const s = settings.reduced ? 1 : t < 0.18 ? easeBack(t / 0.18) : 1;
    const rise = settings.reduced ? 0 : (t > 0.25 ? (t - 0.25) / 0.75 : 0) * p.rise;
    ctx.globalAlpha = t > 0.75 ? (1 - t) / 0.25 : 1;
    const size = p.size * Math.max(0.3, s);
    if (p.kind === 'bang') {
      const w = 28, h = 30;
      frame(d(sx - w / 2), d(sy - h - rise), d(w), d(h), 'gold', 1);
      txt('!', d(sx), d(sy - h / 2 - rise), 16, 'd', BINK, 'center', 'middle');
    } else if (p.kind === 'stamp') {
      const w = txtW(p.text, p.size, 'd') / dpr + 18;
      frame(d(sx - w / 2), d(sy - 13 - rise), d(w), d(26), 'gold', 0);
      txt(p.text, d(sx), d(sy - rise), p.size * Math.min(1, s), 'd', BINK, 'center', 'middle');
    } else if (p.kind === 'label') {
      outlined(p.text, d(sx), d(sy - rise), p.size, 'b', p.color);
    } else {
      outlined(p.text, d(sx), d(sy - rise), size, 'd', p.color);
    }
    ctx.globalAlpha = 1;
  }
  pops = pops.filter((p) => gt - p.t0 < p.ms);
}
function drawBanners() {
  const now = gt;
  banners = banners.filter((b) => now - b.t0 < b.ms);
  const b = banners[banners.length - 1];
  if (!b) return;
  const t = now - b.t0;
  const inT = settings.reduced ? 1 : Math.min(1, t / 220), outT = settings.reduced ? 1 : Math.min(1, (b.ms - t) / 220);
  const w = Math.min(SW - 24, 360);
  const lines = wrapLines(b.sub || '', d(w - 24), 9, 'm');
  const h = 34 + lines.length * 13;
  const x = SW / 2 - w / 2;
  const baseY = (mode === 'walk' ? safe.t + 72 : safe.t + 8 + 60 + (fight && terrainAt(bram.x, bram.y) && terrainAt(bram.x, bram.y) !== 'mark' ? 24 : 0) + (fight && fight.foes.some((f) => f.kind === 'glare' && f.hp > 0 && isWater(f.x, f.y + f.hoverH)) ? 24 : 0));
  const y = baseY - (1 - easeBack(Math.min(inT, outT))) * 30;
  ctx.globalAlpha = Math.min(inT, outT);
  frame(d(x), d(y), d(w), d(h), b.tone, 1);
  const light = ['night', 'danger', 'leaf', 'nap'].includes(b.tone);
  txt(b.title, d(SW / 2), d(y + 9), 9, 'd', light ? '#FFF7E2' : BINK, 'center');
  lines.forEach((l, i) => txt(l, d(SW / 2), d(y + 26 + i * 13), 9, 'm', light ? '#E9E2D0' : INK, 'center'));
  ctx.globalAlpha = 1;
}

function modalBox(h) {
  ctx.fillStyle = 'rgba(15,16,32,0.62)'; ctx.fillRect(0, 0, W, H);
  const w = Math.min(SW - 24, 378), x = SW / 2 - w / 2, y = Math.max(safe.t + 12, SH / 2 - h / 2);
  frame(d(x), d(y), d(w), d(h), 'paper', 2);
  return { x, y, w, h };
}
function drawHowTo() {
  const B = modalBox(Math.min(SH - safe.t - safe.b - 24, 640));
  btn('modal-bg', 0, 0, SW, SH, true, () => {});
  txt('NAPATTACK · MOCK', d(B.x + 16), d(B.y + 16), 8, 'd', '#AE5A40');
  txt('FIGHTS: IN-WORLD TURNS', d(B.x + 16), d(B.y + 32), 10, 'd', BINK);
  const items = [
    ['TAP THE GROUND TO WALK.', 'Bramble walks the woodland path; Moss follows a step behind.'],
    ['A GLARE DRIFTS IN.', 'A wisp of screen light from the city, always visible first. Walk on and it lets you be. Meet it, or tap it, and you spar right there on the path.'],
    ['CHOOSE, THEN PLAY.', 'Pick a card on the ring under your right thumb, then tap the big button. With nothing chosen, the button is BE STILL: +1 energy, +1 Aim.'],
    ['AIM.', 'BE STILL, TAKE COVER or ending a turn with energy left banks Aim. LOOSE and LONG SHOT spend it for more.'],
    ['TAP AS THE RING CLOSES.', 'During a shot, a tap anywhere as the gold ring meets the white adds a quarter. A miss is a plain hit. TIMING switches it off.'],
    ['THE GROUND MATTERS.', 'Marked spots (bridge, shade, bank) are a step away; stepping uses your turn.'],
    ['THE STONE RING.', 'Follow the signpost (or ARENA) to spar with the Static Storm. Nothing is lost if Bramble gets tired.'],
  ];
  let y = B.y + 58;
  const maxY = B.y + B.h - 72;
  for (const [h, body] of items) {
    if (y > maxY) break;
    txt(h, d(B.x + 16), d(y), 10, 'b', BINK); y += 15;
    for (const l of wrapLines(body, d(B.w - 32), 9.5, 'm')) { if (y > maxY) break; txt(l, d(B.x + 16), d(y), 9.5, 'm', INK); y += 13; }
    y += 7;
  }
  const bw = 200, bx = SW / 2 - bw / 2, by = B.y + B.h - 62;
  const dn = btn('howto-go', bx, by, bw, 52, true, () => { overlay = null; store.set('seen', true); if (mode === 'boot') mode = 'walk'; });
  frame(d(bx), d(by), d(bw), d(48), 'leaf', 2, dn);
  txt("LET'S GO", d(SW / 2), d(by + 24) + (dn ? 2 * U : 0), 13, 'b', '#FFFDF5', 'center', 'middle');
}
function drawSettings() {
  const B = modalBox(330);
  btn('modal-bg', 0, 0, SW, SH, true, () => {});
  txt('SETTINGS', d(B.x + 16), d(B.y + 16), 11, 'd', BINK);
  const rows = [
    ['TIMING (THE TAP DURING A SHOT)', ['TAP', 'RELAXED', 'OFF'], () => settings.timing, (v) => (settings.timing = v)],
    ['SCREEN SHAKE', ['ON', 'OFF'], () => (settings.shake ? 'ON' : 'OFF'), (v) => (settings.shake = v === 'ON')],
    ['MOTION', ['FULL', 'REDUCED'], () => (settings.reduced ? 'REDUCED' : 'FULL'), (v) => (settings.reduced = v === 'REDUCED')],
  ];
  let y = B.y + 44;
  for (const [label, opts, get, set] of rows) {
    txt(label, d(B.x + 16), d(y), 9.5, 'b', BINK); y += 16;
    const ow = (B.w - 32 - (opts.length - 1) * 8) / opts.length;
    opts.forEach((o, i) => {
      const x = B.x + 16 + i * (ow + 8);
      const on = get() === o;
      const dn = btn('set-' + label + o, x, y, ow, 46, true, () => { set(o); saveSettings(); });
      frame(d(x), d(y), d(ow), d(42), on ? 'gold' : 'paper', 1, dn);
      txt(o, d(x + ow / 2), d(y + 21) + (dn ? U : 0), 10, 'b', BINK, 'center', 'middle');
    });
    y += 60;
  }
  txt(prefersReduced ? 'YOUR PHONE ASKS FOR REDUCED MOTION.' : 'REDUCED MOTION: NO SHAKE, NO CAMERA MOVES, STILL RINGS.', d(B.x + 16), d(y - 6), 8.5, 'm', INK);
  const bw = 160, bx = SW / 2 - bw / 2, by = B.y + B.h - 60;
  const dn = btn('settings-close', bx, by, bw, 50, true, () => (overlay = null));
  frame(d(bx), d(by), d(bw), d(46), 'leaf', 2, dn);
  txt('DONE', d(SW / 2), d(by + 23) + (dn ? 2 * U : 0), 12, 'b', '#FFFDF5', 'center', 'middle');
}

// ---------- main loop --------------------------------------------------------------------------
function frameLoop(t) {
  const dt = Math.min(50, lastReal ? t - lastReal : 16);
  lastReal = t;
  for (let i = realWaiters.length - 1; i >= 0; i--) if (realWaiters[i].t <= nowR()) realWaiters.splice(i, 1)[0].r();
  if (!overlay) step(dt);
  if (!overlay) update(hitStop > 0 ? 0 : dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#1b2a1c'; ctx.fillRect(0, 0, W, H);
  drawWorld();
  drawUI();
  requestAnimationFrame(frameLoop);
}
document.addEventListener('visibilitychange', () => { lastReal = 0; });
window.addEventListener('resize', resize);

// test hooks (for the Playwright run): read-only views and a way to place things
window.NA = {
  get state() { return { mode, overlay, bram: { x: bram.x, y: bram.y, hp: bram.hp, aim: bram.aim, act: bram.act, face: bram.face, guard: bram.guard }, fight: fight && { kind: fight.kind, turn: fight.turn, awaiting: fight.awaiting, energy: fight.F.energy, hand: fight.F.hand.slice(), timingOpen: !!(fight.timing && fight.timing.open), timingIn: fight.timing ? fight.timing.impact - nowR() : null, sel: fight.sel && fight.sel.kind, over: !!fight.over, done: fight.done || null, mossUsed: fight.mossUsed, spots: fight.spots.map((s) => ({ ...s, screen: toScreen(s.x, s.y) })), foes: fight.foes.map((f) => ({ kind: f.kind, hp: f.hp, max: f.max, intent: f.intent && f.intent.name, x: f.x, y: f.y, screen: toScreen(f.x, f.y) })), lane: fight.lane }, foes: foes.map((f) => ({ kind: f.kind, x: f.x, y: f.y, state: f.state, screen: toScreen(f.x, f.y) })), cam: { ...cam }, buttons: buttons.map((b) => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, on: b.on })), banners: banners.map((b) => b.title) }; },
  toScreen, settings, stats,
  teleport(x, y) { bram.x = x; bram.y = y; bram.path = []; trail.length = 0; moss.x = x - 10; moss.y = y; },
  spawnNow() { nextGlareAt = 0; },
  setHp(n) { bram.hp = n; },
  foeHp(n) { if (fight) for (const f of fight.foes) f.hp = Math.min(f.hp, n); },
  glareTo(x, y) { const g = foes.find((f) => f.kind === 'glare'); if (g) { g.x = x; g.y = y; g.alpha = 1; g.route = [[x, y, 60000]]; g.ri = 0; } },
};

(async function boot() {
  resize();
  await loadAll();
  document.getElementById('boot').remove();
  cam.x = bram.x; cam.y = bram.y; cam.k = kWalk(); clampCam();
  trail.push([bram.x, bram.y]);
  anim(bram, 'idle', 'S', true);
  storm = makeStorm(); foes.push(storm);
  if (store.get('seen', false) && Q.get('howto') !== '1') mode = 'walk'; else overlay = 'howto';
  if (mode === 'boot') mode = 'walk';
  requestAnimationFrame(frameLoop);
})();
